<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 -17 34 34" width="34mm" height="34mm">
<title>Speaker (stock, 8 ohm), under the apron</title>
<style>
  .speaker-frame { fill: #2b2d33; stroke: #111114; stroke-width: 0.5; }
