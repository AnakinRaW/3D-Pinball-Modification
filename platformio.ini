; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/src
test_dir = firmware/tests
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/firmware
; The build cache holds every object file by its command line, its source and its place in the
; build folder. Worktrees share the build folder, so a build after another worktree's build takes
; back the files it compiled before rather than compiling them again
build_cache_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/build-cache
description = The firmware for the pinball mod
default_envs = debug

; the settings every Teensy build shares
[teensy]
platform = teensy
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
lib_deps = 
	https://github.com/h4yn0nnym0u5e/freertos-teensy.git#aa455e0f7c81b5ac4e14cb8a099330eb0f8dd87b
	lvgl/lvgl@9.6.0
	fastled/FastLED@3.10.9
	https://github.com/tonton81/WDT_T4.git#1910b57d24468cd3419959118a2e1e6192f5e7fa
	SdFat
	SPI
	Wire
build_flags = 
	-D LV_CONF_SKIP
	-I "${PROJECT_DIR}/firmware/include"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SdFat/src"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SPI"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/Wire"
build_src_flags = -Wall -Wextra -Werror
lib_ldf_mode = off
upload_protocol = teensy-gui
extra_scripts = pre:firmware/tools/quiet-libraries.py
board_build.ldscript = firmware/linker/teensy41.ld

; the firmware with its debug code, built by a plain run or upload. DEBUG reaches only the
; firmware's own code: freertos-teensy names a constant DEBUG
[env:debug]
extends = teensy
build_src_flags = ${teensy.build_src_flags} -D DEBUG

; the firmware for the machine, built only with -e release
[env:release]
extends = teensy
build_flags = ${teensy.build_flags} -D NDEBUG

; the tests that need no hardware, built for the computer and run there. Each test takes the
; firmware's code from firmware/src, and build_src_filter names the files of it that build without
; the Teensy. Fakes of the Teensy core, of FastLED and of the lighting driver stand in
; firmware/tests/fakes, each at the path of the header it replaces
[env:computer]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
	+<core/>
	+<drivers/driver-base.cpp>
	+<components/>
	+<game/>
; the firmware includes its own headers in quotes, which GCC looks up in the -iquote folders before
; the -I folders, so a fake there wins over the header of firmware/src it replaces
build_flags =
	-std=gnu++17
	-iquote firmware/tests/fakes
	-I firmware/tests/fakes
	-Wall -Wextra -Werror
