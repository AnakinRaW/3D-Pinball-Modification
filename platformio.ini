; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/src
test_dir = firmware/tests
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/firmware
; The build cache holds every object file by its command line, its source and its place in the
; build folder. Worktrees share the build folder, so a build after another worktree's build takes
; back the files it compiled before rather than compiling them again
build_cache_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/build-cache
description = The firmware for the pinball mod
default_envs = debug

; libyaml 0.2.6 parses the machine config and the games' files. Its sources take their version
; from these defines, which libyaml's CMake build writes into a config.h
[libyaml]
lib_deps = libyaml=https://github.com/yaml/libyaml.git#fc96aa689026e314f2177e69a2903ef045aec571
build_flags =
	-D YAML_VERSION_MAJOR=0
	-D YAML_VERSION_MINOR=2
	-D YAML_VERSION_PATCH=6
	'-D YAML_VERSION_STRING="0.2.6"'

; the settings every Teensy build shares
[teensy]
platform = teensy@6.0.0
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
lib_deps = 
	https://github.com/h4yn0nnym0u5e/freertos-teensy.git#aa455e0f7c81b5ac4e14cb8a099330eb0f8dd87b
	lvgl/lvgl@9.6.0
	fastled/FastLED@3.10.10
	https://github.com/tonton81/WDT_T4.git#1910b57d24468cd3419959118a2e1e6192f5e7fa
	${libyaml.lib_deps}
	Audio
	SD
	SerialFlash
	SdFat
	SPI
	Wire
build_flags = 
	${libyaml.build_flags}
	-I "${PROJECT_DIR}/firmware/include"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SdFat/src"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SPI"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/Wire"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/Audio"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SD/src"
	-I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SerialFlash"
build_src_flags = -Wall -Wextra -Werror
lib_ldf_mode = off
upload_protocol = teensy-gui
extra_scripts =
	pre:firmware/tools/generate-fonts.py
	pre:firmware/tools/quiet-libraries.py
	post:firmware/tools/card-target.py
	post:firmware/tools/ram1-floor.py
board_build.ldscript = firmware/linker/teensy41.ld

; the firmware with its debug code, built by a plain run or upload. DEBUG reaches only the
; firmware's own code: freertos-teensy names a constant DEBUG
[env:debug]
extends = teensy
build_src_flags = ${teensy.build_src_flags} -D DEBUG

; the firmware for the machine, built only with -e release
[env:release]
extends = teensy
build_flags = ${teensy.build_flags} -D NDEBUG

; the tests that need no hardware, built for the computer and run there. Each test takes the
; firmware's code from firmware/src, and build_src_filter names the files of it that build without
; the Teensy. Fakes of the Teensy core, of FastLED, of the lighting driver and of the I²C bus stand in
; firmware/tests/fakes, each at the path of the header it replaces. libyaml builds from its sources
; here as on the Teensy. quiet-libraries.py keeps its warnings out of the run
[env:computer]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
	+<core/>
	+<logging/>
	+<io/card-appender.cpp>
	+<drivers/driver-base.cpp>
	+<drivers/toggle-switch.cpp>
	+<drivers/sound-channel.cpp>
	+<drivers/sound-mixer.cpp>
	+<drivers/storage-service.cpp>
	+<drivers/touch.cpp>
	+<drivers/break-beam.cpp>
	+<components/>
	+<game/>
	+<host/>
; LVGL builds for the computer with the firmware's lv_conf.h, so the screen and the video player
; run there as on the Teensy
lib_deps =
	lvgl/lvgl@9.6.0
	${libyaml.lib_deps}
; the firmware includes its own headers in quotes, which GCC looks up in the -iquote folders before
; the -I folders, so a fake there wins over the header of firmware/src it replaces
build_flags =
	${libyaml.build_flags}
	-std=gnu++17
	-iquote firmware/tests/fakes
	-I firmware/tests/fakes
	-I firmware/include
	-D UNITY_INCLUDE_DOUBLE
	-Wall -Wextra -Werror
extra_scripts =
	pre:firmware/tools/generate-fonts.py
	pre:firmware/tools/quiet-libraries.py
