; the program card-upload.py flashes for a moment to write files onto the card in the Teensy's
; socket. It stands apart from the firmware, which knows nothing of it
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/card-upload
build_cache_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/build-cache

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
lib_deps =
    SdFat
build_flags =
    -I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SdFat/src"
upload_protocol = teensy-gui
