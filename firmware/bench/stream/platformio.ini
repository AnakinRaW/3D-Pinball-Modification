; the stream test built the way the firmware is built: PlatformIO with Teensyduino 1.62, the
; libraries at the versions the firmware design names, and the linker script that keeps LVGL's
; code in the flash. It takes the storage driver from firmware/src as the library firmware
; PlatformIO's build and library folders sit under %LOCALAPPDATA%\pio, one per project, since a
; checkout deep in a worktree pushes LVGL's include paths past the 260 characters Windows allows
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/bench-stream
build_cache_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/build-cache

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
lib_deps =
    https://github.com/h4yn0nnym0u5e/freertos-teensy.git#aa455e0f7c81b5ac4e14cb8a099330eb0f8dd87b
    lvgl/lvgl@9.6.0
    fastled/FastLED@3.10.10
    firmware=symlink://${PROJECT_DIR}/../../src
    SdFat
    SPI
lib_ldf_mode = off
build_flags =
    -I include
    -I "${PROJECT_DIR}/../../include"
    -I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SdFat/src"
    -I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SPI"
    -D LV_CONF_INCLUDE_SIMPLE
custom_firmware_src =
    +<core/clock.cpp>
    +<drivers/driver-base.cpp>
    +<drivers/storage.cpp>
    +<drivers/storage-service.cpp>
    +<logging/>
    +<io/>
upload_protocol = teensy-gui
board_build.ldscript = ../../linker/teensy41.ld
