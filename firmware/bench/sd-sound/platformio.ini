; the sound test built the way the firmware is built: PlatformIO with Teensyduino 1.62 and the
; linker script that keeps LVGL's code in the flash. Audio and SD come with Teensyduino, and the
; libraries compile quietly, so a warning in this program fails the build
; PlatformIO's build and library folders sit under %LOCALAPPDATA%\pio, one per project, since a
; checkout deep in a worktree pushes include paths past the 260 characters Windows allows
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/bench-sd-sound
build_cache_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/build-cache

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
upload_protocol = teensy-gui
board_build.ldscript = ../../linker/teensy41.ld
build_src_flags = -Wall -Wextra -Werror
extra_scripts = pre:../../tools/quiet-libraries.py
