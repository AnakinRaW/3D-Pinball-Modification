; the break beam test built the way the firmware is built: PlatformIO with Teensyduino and
; the linker script that keeps LVGL's code in the flash. It needs no library
; PlatformIO's build and library folders sit under %LOCALAPPDATA%\pio, one per project, since a
; checkout deep in a worktree pushes include paths past the 260 characters Windows allows
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/bench-break-beam
build_cache_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/build-cache

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
upload_protocol = teensy-gui
board_build.ldscript = ../../linker/teensy41.ld
