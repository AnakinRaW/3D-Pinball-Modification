; the servo trial built the way the firmware is built: PlatformIO with Teensyduino 1.62 and the
; linker script that keeps LVGL's code in the flash. It needs no library beyond the Teensy core.
; PlatformIO's build folder sits under %LOCALAPPDATA%\pio, one per project, since a checkout deep in
; a worktree pushes include paths past the 260 characters Windows allows
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/bench-servo

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
build_flags =
    -I include
upload_protocol = teensy-gui
board_build.ldscript = ../../linker/teensy41.ld
