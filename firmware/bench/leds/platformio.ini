; the LED test built the way the firmware is built: PlatformIO with Teensyduino 1.62, FastLED
; 3.10.9, the lighting driver and the linker script that keeps LVGL's code in the flash
; PlatformIO's build and library folders sit under %LOCALAPPDATA%\pio, one per project, since a
; checkout deep in a worktree pushes include paths past the 260 characters Windows allows
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/bench-leds
build_cache_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/build-cache

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
lib_deps =
    fastled/FastLED@3.10.9
    firmware=symlink://${PROJECT_DIR}/../../src
custom_firmware_src =
    +<drivers/driver-base.cpp>
    +<drivers/ws2812-flexio2.cpp>
    +<drivers/lighting.cpp>
upload_protocol = teensy-gui
board_build.ldscript = ../../linker/teensy41.ld
