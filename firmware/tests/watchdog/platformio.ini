; the watchdog test built the way the firmware is built: PlatformIO with Teensyduino 1.62, the
; libraries at the versions the firmware design names, and the linker script that keeps LVGL's
; code in the flash
; PlatformIO's build and library folders sit under %LOCALAPPDATA%\pio, one per project, since a
; checkout deep in a worktree pushes LVGL's include paths past the 260 characters Windows allows
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/$PROJECT_HASH

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
lib_deps =
    https://github.com/h4yn0nnym0u5e/freertos-teensy.git#aa455e0f7c81b5ac4e14cb8a099330eb0f8dd87b
    https://github.com/tonton81/WDT_T4.git
build_flags =
    -I include
upload_protocol = teensy-gui
board_build.ldscript = ../../linker/teensy41.ld
