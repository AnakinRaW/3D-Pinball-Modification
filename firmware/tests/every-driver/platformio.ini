; the every-driver test program of docs/firmware/testing.md, built the way the firmware is built:
; PlatformIO with Teensyduino 1.62, FastLED 3.10.9 and the linker script that keeps LVGL's code in
; the flash. It takes the lighting and the servo driver from firmware/lib, and the libraries and
; the Teensy core compile with -w, so a build reports only the warnings of the firmware's own code.
; PlatformIO's build folder sits under %LOCALAPPDATA%\pio, one per project, since a checkout deep in
; a worktree pushes include paths past the 260 characters Windows allows
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/tests-every-driver
lib_dir = ../../lib

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
lib_deps =
    fastled/FastLED@3.10.9
    driver-base
    pwm-servo-t4
    servo-driver
    lighting
build_src_flags =
    -D DEBUG
    -Wall -Wextra -Werror
extra_scripts = pre:../../tools/quiet-libraries.py
upload_protocol = teensy-gui
board_build.ldscript = ../../linker/teensy41.ld
