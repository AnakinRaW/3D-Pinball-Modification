; the test image of docs/firmware/testing.md: every Teensy test of every program in one firmware,
; built and flashed once, which firmware/tools/teensy-tests.py drives over USB serial. Each program
; stands in src/<program>.
; It is built the way the firmware is built: PlatformIO with Teensyduino and the linker script
; that keeps LVGL's code in the flash. It takes the firmware's code from firmware/src as the
; library firmware, every file but main.cpp, and the other libraries at the root's versions.
; quiet-libraries.py hands DEBUG and the warning flags of build_src_flags to src, include and
; firmware/src, and compiles everything else with -w.
; The symlink to firmware/src names this checkout's path: the library folder lies in the build
; folder the worktrees share, and a relative link would keep the first worktree's path
; PlatformIO's build folder sits under %LOCALAPPDATA%\pio, since a checkout deep in a worktree
; pushes include paths past the 260 characters Windows allows. Worktrees share it and the build
; cache, so a build after another worktree's build takes back the files it compiled before
[platformio]
workspace_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/tests-teensy
build_cache_dir = ${sysenv.LOCALAPPDATA}/pio/3d-pinball-modification/build-cache

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
platform_packages = platformio/framework-arduinoteensy@1.162.0
lib_deps =
    https://github.com/h4yn0nnym0u5e/freertos-teensy.git#aa455e0f7c81b5ac4e14cb8a099330eb0f8dd87b
    fastled/FastLED@3.10.10
    firmware=symlink://${PROJECT_DIR}/../../src
    SdFat
    SPI
    Wire
build_flags =
    -I "${PROJECT_DIR}/../../include"
    -I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SdFat/src"
    -I "${platformio.packages_dir}/framework-arduinoteensy/libraries/SPI"
    -I "${platformio.packages_dir}/framework-arduinoteensy/libraries/Wire"
build_src_flags =
    -D DEBUG
    -Wall -Wextra -Werror
lib_ldf_mode = off
upload_protocol = teensy-gui
extra_scripts = pre:../../tools/quiet-libraries.py
board_build.ldscript = ../../linker/teensy41.ld
