name: figures

on:
  push:
    paths:
      - "docs/**"
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/figures.yml"
  pull_request:
    paths:
      - "docs/**"
      - "firmware/**"
      - "tools/**"

jobs:
  figures:
    name: Do the documents still state what the design computes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every subsystem that derives figures declares them in its own
      # docs/parts/<subsystem>/figures.py, and the figures the subsystems share
      # stand in docs/research/teensy-4.1.py and firmware/figures.py. figcheck
      # finds each one, checks it, and then checks every marked Teensy pin
      # against docs/pin-assignment.md.
      - name: Recompute every figure and check the documents and the pins against it
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
        run: python tools/figcheck.py --sheets --base "$BASE"

      - name: Prove the check would catch a wrong figure
        run: python tools/figcheck.py --mutate --no-stale

      # Where every input value came from, readable in the log without a
      # checkout of the repository.
      - name: Record where every input value came from
        run: python tools/figcheck.py --provenance --no-stale
