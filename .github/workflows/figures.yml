name: figures

on:
  push:
    paths:
      - "docs/**"
      - "model/**"
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/figures.yml"
  pull_request:
    paths:
      - "docs/**"
      - "model/**"
      - "firmware/**"
      - "tools/**"

jobs:
  figures:
    name: Do the documents still state what the design computes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every subsystem that derives figures declares them in its own
      # model/parts/<subsystem>/figures.py, and the figures the subsystems share
      # stand in model/research/teensy-4.1.py and model/firmware/figures.py. figcheck
      # finds each one, checks it, and then checks every marked Teensy pin
      # against docs/pin-assignment.md.
      - name: Recompute every figure and check the documents and the pins against it
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
        run: python tools/figcheck.py --sheets --base "$BASE"

      - name: Prove the check would catch a wrong figure
        run: python tools/figcheck.py --mutate
