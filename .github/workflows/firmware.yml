name: firmware

on:
  push:
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "docs/firmware/testing.md"
      - "tools/fonts.py"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "docs/firmware/testing.md"
      - "tools/fonts.py"
      - ".github/workflows/firmware.yml"

jobs:
  format:
    name: Check the firmware's layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # firmware/.clang-format holds the code style of firmware/CLAUDE.md
      - name: Check every source file of the firmware, its libraries and its tests against it
        run: |
          python -m pip install clang-format==18.1.8
          find firmware/src firmware/include firmware/tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror

  build:
    name: Build the release firmware and run the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      # The build converts the host screens' fonts with lv_font_conv from npm, which the runner's
      # Node.js runs. The cache holds them with the stamp tools/fonts.py checks, so a run converts
      # only after a font in firmware/fonts/ or the script changed. Every later step reads them.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/cache@v4
        with:
          path: firmware/src/host/views/fonts
          key: fonts-${{ hashFiles('firmware/fonts/**', 'tools/fonts.py') }}

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build
        env:
          # platformio.ini puts PlatformIO's build and library folders under %LOCALAPPDATA%\pio
          LOCALAPPDATA: ${{ runner.temp }}
        run: python -m platformio run -e release

      # the tests that need no hardware, from the first test_ folder in firmware/tests on; the
      # Teensy tests stand beside them in the test image firmware/tests/teensy and run on the bench
      - name: Test
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        run: |
          if compgen -G "firmware/tests/test_*" > /dev/null; then
            python -m platformio test -e computer --json-output-path "${{ runner.temp }}/computer-tests.json"
          fi

      # Fails when a test in the code has no row in testing.md or runs somewhere other than its row
      # says, after the self-test has shown that the check catches each case. The computer tests
      # count as they ran, from the report of the step above. The table of every program's coverage
      # goes to the run's summary page.
      - name: Match every test with its row and count the rows that have a test
        if: success() || failure()
        run: |
          python firmware/tools/test-coverage.py --self-test
          results="${{ runner.temp }}/computer-tests.json"
          if [ -f "$results" ]; then
            python firmware/tools/test-coverage.py --missing --computer-results "$results"
          else
            python firmware/tools/test-coverage.py --missing
          fi

      # firmware/.clang-tidy names the checks, and the run fails on any finding in firmware/. The
      # self-test first shows that a clean file passes and a flawed one is caught
      - name: Check the firmware's code with clang-tidy
        if: success() || failure()
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        run: |
          python -m pip install clang-tidy==18.1.8
          python firmware/tools/tidy.py --self-test
          python firmware/tools/tidy.py
