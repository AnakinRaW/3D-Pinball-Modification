name: firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  format:
    name: Check the firmware's layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # firmware/.clang-format holds the code style of firmware/CLAUDE.md
      - name: Check every source file of the firmware against it
        run: |
          python -m pip install clang-format==18.1.8
          find firmware/src \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the firmware is built and tested as the release build
          - project: firmware/src
            args: -e release
          - project: firmware/tests/stack
          - project: firmware/tests/load
          - project: firmware/tests/watchdog
          - project: firmware/tests/card-pull
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build
        env:
          # each platformio.ini puts PlatformIO's build and library folders under %LOCALAPPDATA%\pio
          LOCALAPPDATA: ${{ runner.temp }}
        run: python -m platformio run -d ${{ matrix.project }} ${{ matrix.args }}
