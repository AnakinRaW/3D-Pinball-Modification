name: dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  outdated:
    name: Does a locked dependency of the firmware have a newer release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every dependency is locked to an exact version, so PlatformIO never reports a release. The run
      # lists each dependency behind its newest release, and a failed scheduled run notifies the
      # repository's owner.
      - name: List the dependencies that are behind
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python firmware/tools/outdated-dependencies.py
