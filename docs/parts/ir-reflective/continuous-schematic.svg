<svg viewBox="0 0 900 545" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="545" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Rejected variant: continuously lit LED</text>
  <text x="30" y="56" font-size="13" fill="#666">No clock and no switching transistor. Works only where no ambient IR reaches the sensor.</text>

  <!-- Teensy -->
  <rect x="50" y="100" width="180" height="380" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="90" y="130" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <circle cx="230" cy="170" r="6" fill="#c0392b"/>
  <text x="215" y="174" text-anchor="end" font-size="13" font-weight="700" fill="#c0392b">3V3</text>
  <circle cx="230" cy="290" r="6" fill="#2c3e50"/>
  <text x="215" y="284" text-anchor="end" font-size="13" font-weight="700" fill="#2c3e50">Sn</text>
  <text x="215" y="300" text-anchor="end" font-size="11.5" fill="#777">any ADC pin</text>
  <circle cx="230" cy="450" r="6" fill="#1a1a1a"/>
  <text x="215" y="454" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <text x="60" y="470" font-size="10.5" fill="#777">Allocation in pin-assignment.md</text>

  <!-- Sensor -->
  <rect x="680" y="100" width="180" height="330" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="700" y="130" font-size="16" font-weight="700" fill="#5c4a00">Sensor board</text>
  <circle cx="680" cy="170" r="6" fill="#c0392b"/>
  <text x="696" y="174" font-size="13" font-weight="700" fill="#c0392b">Pin 1 (red)</text>
  <circle cx="680" cy="290" r="6" fill="#2c3e50"/>
  <text x="696" y="294" font-size="13" font-weight="700" fill="#2c3e50">Pin 2 (black)</text>
  <circle cx="680" cy="390" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <text x="696" y="394" font-size="13" font-weight="700" fill="#8a6d0b">Pin 3 (yellow)</text>

  <!-- 3V3 -> Pin 1 -->
  <line x1="236" y1="170" x2="674" y2="170" stroke="#c0392b" stroke-width="2.5"/>
  <text x="400" y="162" font-size="13" font-weight="700" fill="#c0392b">+3.3 V (not 5 V)</text>

  <!-- Pin 2 -> 1 k -> ADC pin, with the pull-down at the sensor-side node -->
  <line x1="674" y1="290" x2="430" y2="290" stroke="#2c3e50" stroke-width="2.5"/>
  <circle cx="430" cy="290" r="4" fill="#2c3e50"/>
  <line x1="430" y1="290" x2="360" y2="290" stroke="#2c3e50" stroke-width="2.5"/>
  <rect x="300" y="282" width="60" height="16" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="302" y="276" font-size="12.5" font-weight="700" fill="#1a1a1a">1 kΩ</text>
  <line x1="300" y1="290" x2="236" y2="290" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="452" y="282" font-size="12.5" fill="#2c3e50">Signal: 0 … 2.98 V at V_OUT max</text>
  <text x="452" y="310" font-size="11" fill="#777">11 kΩ source impedance with the sensor dark</text>

  <line x1="430" y1="290" x2="430" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="417" y="330" width="26" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="410" y="364" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">10 kΩ</text>
  <line x1="430" y1="390" x2="430" y2="500" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Pin 3 -> 220 R -> GND -->
  <line x1="674" y1="390" x2="620" y2="390" stroke="#b7950b" stroke-width="2.5"/>
  <rect x="550" y="380" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="552" y="374" font-size="13" font-weight="700" fill="#1a1a1a">220 Ω</text>
  <line x1="550" y1="390" x2="510" y2="390" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="510" y1="390" x2="510" y2="500" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="668" y="418" text-anchor="end" font-size="11.5" fill="#666">permanently lit:</text>
  <text x="668" y="433" text-anchor="end" font-size="11.5" fill="#666">10.0 mA nom, 10.7 mA max</text>

  <!-- GND rail -->
  <line x1="236" y1="450" x2="290" y2="450" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="290" y1="450" x2="290" y2="500" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="290" y1="500" x2="510" y2="500" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="430" cy="500" r="4" fill="#1a1a1a"/>
  <text x="320" y="492" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- note -->
  <rect x="550" y="452" width="330" height="60" rx="6" fill="#fbfaf7" stroke="#8a6d0b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="564" y="472" font-size="11.5" font-weight="700" fill="#5c4a00">Pin 3 terminates at GND: no switched LED bus.</text>
  <text x="564" y="490" font-size="11.5" fill="#5c4a00">Ambient IR reaching the sensor breaks this design.</text>
  <text x="564" y="504" font-size="11.5" fill="#5c4a00">Design B is used everywhere instead.</text>

</svg>
