<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Design A: continuously lit LED, rejected</text>
  <text x="30" y="56" font-size="13" fill="#666">No clock and no switching transistor. Works only where no ambient IR reaches the sensor.</text>

  <!-- 3.3 V rail -->
  <polygon points="120,100 106,94 106,106" fill="#c0392b"/>
  <text x="98" y="104" text-anchor="end" font-size="12.5" font-weight="700" fill="#c0392b">3.3 V</text>
  <line x1="120" y1="100" x2="660" y2="100" stroke="#c0392b" stroke-width="2.5"/>

  <!-- sensor board -->
  <rect x="690" y="110" width="170" height="190" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="704" y="136" font-size="15" font-weight="700" fill="#5c4a00">Sensor board</text>
  <circle cx="690" cy="160" r="6" fill="#c0392b"/>
  <text x="704" y="164" font-size="12" font-weight="700" fill="#c0392b">Pin 1 (red)</text>
  <circle cx="690" cy="200" r="6" fill="#2c3e50"/>
  <text x="704" y="204" font-size="12" font-weight="700" fill="#2c3e50">Pin 2 (black)</text>
  <circle cx="690" cy="255" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <text x="704" y="259" font-size="12" font-weight="700" fill="#8a6d0b">Pin 3 (yellow)</text>

  <line x1="684" y1="160" x2="660" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="660" y1="160" x2="660" y2="100" stroke="#c0392b" stroke-width="2.5"/>

  <!-- channel node with a 10 kOhm pull-down -->
  <line x1="684" y1="200" x2="300" y2="200" stroke="#2c3e50" stroke-width="2.5"/>
  <rect x="200" y="190" width="100" height="20" rx="3" fill="#eef3f8" stroke="#4a6785" stroke-width="1.5"/>
  <text x="250" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#2c3e50">CHn</text>
  <text x="200" y="228" font-size="10.5" fill="#666">to its digitising input</text>
  <text x="200" y="242" font-size="10.5" fill="#666">on the mainboard</text>
  <text x="470" y="192" font-size="11.5" fill="#2c3e50">0 &#8230; 2.98 V at V_OUT max</text>
  <circle cx="440" cy="200" r="4" fill="#2c3e50"/>
  <line x1="440" y1="200" x2="440" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="427" y="220" width="26" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="421" y="254" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a1a">10 k&#937;</text>
  <line x1="440" y1="280" x2="440" y2="296" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="426" y1="296" x2="454" y2="296" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="431" y1="302" x2="449" y2="302" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="436" y1="308" x2="444" y2="308" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Pin 3 permanently to ground through 220 Ohm -->
  <line x1="684" y1="255" x2="620" y2="255" stroke="#b7950b" stroke-width="2.5"/>
  <rect x="550" y="245" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="585" y="259" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">220 &#937;</text>
  <line x1="550" y1="255" x2="530" y2="255" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="530" y1="255" x2="530" y2="310" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="516" y1="310" x2="544" y2="310" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="521" y1="316" x2="539" y2="316" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="526" y1="322" x2="534" y2="322" stroke="#1a1a1a" stroke-width="2"/>
  <text x="560" y="322" font-size="11" fill="#666">permanently lit: 9.4 mA nominal,</text>
  <text x="560" y="337" font-size="11" fill="#666">10.3 mA at V_OUT max, V_F min</text>

</svg>
