<svg viewBox="0 0 880 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#1a1a1a">Rejected: LED permanently on — unusable in practice</text>

  <!-- Teensy -->
  <rect x="50" y="100" width="180" height="360" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="90" y="130" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <circle cx="230" cy="170" r="6" fill="#c0392b"/>
  <text x="130" y="174" font-size="13" font-weight="700" fill="#c0392b">3V3</text>
  <circle cx="230" cy="280" r="6" fill="#2c3e50"/>
  <text x="105" y="284" font-size="13" font-weight="700" fill="#2c3e50">A0 = Pin 14</text>
  <circle cx="230" cy="450" r="6" fill="#1a1a1a"/>
  <text x="130" y="454" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- Sensor -->
  <rect x="660" y="100" width="180" height="330" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="682" y="130" font-size="16" font-weight="700" fill="#5c4a00">Sensor board</text>
  <circle cx="660" cy="170" r="6" fill="#c0392b"/>
  <text x="676" y="174" font-size="13" font-weight="700" fill="#c0392b">Pin 1 (red)</text>
  <circle cx="660" cy="280" r="6" fill="#2c3e50"/>
  <text x="676" y="284" font-size="13" font-weight="700" fill="#2c3e50">Pin 2 (black)</text>
  <circle cx="660" cy="380" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <text x="676" y="384" font-size="13" font-weight="700" fill="#8a6d0b">Pin 3 (yellow)</text>

  <!-- 3V3 -> Pin1 -->
  <line x1="236" y1="170" x2="654" y2="170" stroke="#c0392b" stroke-width="2.5"/>
  <text x="400" y="162" font-size="13" font-weight="700" fill="#c0392b">+3.3 V (not 5 V)</text>

  <!-- Pin2 -> A0 with pull-down -->
  <line x1="654" y1="280" x2="236" y2="280" stroke="#2c3e50" stroke-width="2.5"/>
  <circle cx="430" cy="280" r="4" fill="#2c3e50"/>
  <text x="255" y="272" font-size="12.5" fill="#2c3e50">Signal: 0 … ≈2.8 V</text>
  <line x1="430" y1="280" x2="430" y2="320" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="417" y="320" width="26" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="408" y="348" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">10 kΩ pull-down</text>
  <line x1="430" y1="380" x2="430" y2="490" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Pin3 -> R -> GND -->
  <line x1="654" y1="380" x2="600" y2="380" stroke="#b7950b" stroke-width="2.5"/>
  <rect x="530" y="370" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="522" y="362" font-size="13" font-weight="700" fill="#1a1a1a">220 Ω</text>
  <text x="650" y="412" text-anchor="end" font-size="11.5" fill="#666">≈10 mA</text>
  <line x1="530" y1="380" x2="500" y2="380" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="500" y1="380" x2="500" y2="490" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- GND rail -->
  <line x1="236" y1="450" x2="290" y2="450" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="290" y1="450" x2="290" y2="490" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="290" y1="490" x2="500" y2="490" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="430" cy="490" r="4" fill="#1a1a1a"/>
  <text x="320" y="482" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

</svg>
