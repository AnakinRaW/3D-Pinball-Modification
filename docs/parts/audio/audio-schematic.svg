<svg viewBox="0 0 1050 570" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1050" height="570" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Audio output</text>
  <text x="30" y="56" font-size="13" fill="#666" data-fig="r_spk v_dd">The Teensy sends I²S to a MAX98357A module, which drives the stock 8 Ω speaker from the machine's 5 V</text>

  <!-- J-AMP from the power board -->
  <rect x="50" y="96" width="130" height="80" rx="6" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2"/>
  <text x="62" y="116" font-size="13" font-weight="700" fill="#333333">J-AMP</text>
  <text x="62" y="131" font-size="11" fill="#666">from the</text>
  <text x="62" y="145" font-size="11" fill="#666">power board</text>
  <circle cx="180" cy="132" r="6" fill="#c0392b"/>
  <text x="170" y="137" text-anchor="end" font-size="12.5" font-weight="700" fill="#c0392b" data-fig="v_dd">5 V</text>
  <circle cx="180" cy="158" r="6" fill="#1a1a1a"/>
  <text x="170" y="163" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a1a">GND</text>
  <line x1="186" y1="132" x2="314" y2="132" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="186" y1="158" x2="314" y2="158" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Teensy block -->
  <rect x="50" y="212" width="190" height="300" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="64" y="240" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <text x="64" y="258" font-size="11.5" fill="#666">I²S2 port</text>

  <circle cx="240" cy="282" r="6" fill="#2c3e50"/>
  <text x="230" y="286" text-anchor="end" font-size="13" font-weight="700" fill="#2c3e50">DIN</text>
  <text x="230" y="302" text-anchor="end" font-size="11.5" fill="#777" data-pin="DIN to the DFR0954">pin 2</text>

  <circle cx="240" cy="332" r="6" fill="#8a2be2"/>
  <text x="230" y="336" text-anchor="end" font-size="13" font-weight="700" fill="#8a2be2">LRC</text>
  <text x="230" y="352" text-anchor="end" font-size="11.5" fill="#777" data-pin="LRC to the DFR0954">pin 3</text>

  <circle cx="240" cy="382" r="6" fill="#8a2be2"/>
  <text x="230" y="386" text-anchor="end" font-size="13" font-weight="700" fill="#8a2be2">BCLK</text>
  <text x="230" y="402" text-anchor="end" font-size="11.5" fill="#777" data-pin="BCLK to the DFR0954">pin 4</text>

  <circle cx="240" cy="492" r="6" fill="#1a1a1a"/>
  <text x="230" y="496" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- ===== amplifier board ===== -->
  <rect x="290" y="66" width="570" height="484" rx="12" fill="none" stroke="#8a6d0b" stroke-width="1.5"/>
  <text x="306" y="88" font-size="15" font-weight="700" fill="#5c4a00">Amplifier board</text>

  <!-- J-PWR, fed from the power board's J-AMP -->
  <rect x="320" y="96" width="90" height="76" rx="8" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2"/>
  <text x="365" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">J-PWR</text>
  <circle cx="320" cy="132" r="6" fill="#c0392b"/>
  <circle cx="410" cy="132" r="6" fill="#c0392b"/>
  <text x="365" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" data-fig="v_dd">5 V</text>
  <circle cx="320" cy="158" r="6" fill="#1a1a1a"/>
  <circle cx="410" cy="158" r="6" fill="#1a1a1a"/>
  <text x="365" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- J-PWR's GND onto the board's ground -->
  <line x1="416" y1="158" x2="440" y2="158" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="440" y1="158" x2="440" y2="172" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="426" y1="172" x2="454" y2="172" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="431" y1="178" x2="449" y2="178" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="436" y1="184" x2="444" y2="184" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 5 V rail to VCC and through R1 to GAIN -->
  <line x1="416" y1="132" x2="680" y2="132" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="560" cy="132" r="4" fill="#c0392b"/>
  <line x1="560" y1="132" x2="560" y2="206" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="680" y1="132" x2="680" y2="142" stroke="#c0392b" stroke-width="2.5"/>

  <rect x="667" y="142" width="26" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="702" y="164" font-size="13" font-weight="700" fill="#1a1a1a">R1</text>
  <text x="702" y="180" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="r_gain">100 kΩ</text>
  <text x="702" y="196" font-size="11.5" fill="#666" data-fig="gain">3 dB, the lowest gain</text>
  <line x1="680" y1="202" x2="680" y2="206" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- DFR0954 module, a daughter board -->
  <rect x="520" y="212" width="200" height="300" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="620" y="430" text-anchor="middle" font-size="16" font-weight="700" fill="#5c4a00">DFR0954</text>
  <text x="620" y="448" text-anchor="middle" font-size="11.5" fill="#666">MAX98357A, class D</text>
  <text x="620" y="464" text-anchor="middle" font-size="11.5" fill="#666">SD set to mix both channels</text>

  <circle cx="560" cy="212" r="6" fill="#c0392b"/>
  <text x="560" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">VCC</text>

  <circle cx="680" cy="212" r="6" fill="#2c3e50"/>
  <text x="680" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">GAIN</text>

  <circle cx="520" cy="282" r="6" fill="#2c3e50"/>
  <text x="532" y="286" font-size="13" font-weight="700" fill="#2c3e50">DIN</text>

  <circle cx="520" cy="332" r="6" fill="#8a2be2"/>
  <text x="532" y="336" font-size="13" font-weight="700" fill="#8a2be2">LRC</text>

  <circle cx="520" cy="382" r="6" fill="#8a2be2"/>
  <text x="532" y="386" font-size="13" font-weight="700" fill="#8a2be2">BCLK</text>

  <circle cx="520" cy="492" r="6" fill="#1a1a1a"/>
  <text x="532" y="496" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <circle cx="720" cy="312" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
  <text x="708" y="316" text-anchor="end" font-size="13" font-weight="700" fill="#8a6d0b">SPK+</text>

  <circle cx="720" cy="372" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
  <text x="708" y="376" text-anchor="end" font-size="13" font-weight="700" fill="#8a6d0b">SPK−</text>

  <!-- I²S lines -->
  <line x1="246" y1="282" x2="514" y2="282" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="246" y1="332" x2="514" y2="332" stroke="#8a2be2" stroke-width="2.5"/>
  <line x1="246" y1="382" x2="514" y2="382" stroke="#8a2be2" stroke-width="2.5"/>

  <!-- the Teensy's ground onto the board's ground and the module -->
  <line x1="246" y1="492" x2="514" y2="492" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="380" cy="492" r="4" fill="#1a1a1a"/>
  <line x1="380" y1="492" x2="380" y2="506" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="366" y1="506" x2="394" y2="506" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="371" y1="512" x2="389" y2="512" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="376" y1="518" x2="384" y2="518" stroke="#1a1a1a" stroke-width="2"/>

  <!-- speaker -->
  <rect x="900" y="272" width="120" height="140" rx="8" fill="#fbeef5" stroke="#a8437a" stroke-width="2"/>
  <text x="932" y="336" font-size="16" font-weight="700" fill="#7a2556">Speaker</text>
  <text x="932" y="354" font-size="11.5" fill="#666" data-fig="r_spk">8 Ω, stock</text>
  <circle cx="900" cy="312" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
  <text x="912" y="316" font-size="13" font-weight="700" fill="#8a6d0b">+</text>
  <circle cx="900" cy="372" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
  <text x="912" y="376" font-size="13" font-weight="700" fill="#8a6d0b">−</text>
  <line x1="726" y1="312" x2="894" y2="312" stroke="#b7950b" stroke-width="2.5"/>
  <line x1="726" y1="372" x2="894" y2="372" stroke="#b7950b" stroke-width="2.5"/>
</svg>
