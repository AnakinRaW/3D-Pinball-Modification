<svg viewBox="0 0 1060 490" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="490" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Servo</text>

  <!-- ===== Teensy ===== -->
  <rect x="20" y="150" width="130" height="100" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="34" y="176" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <circle cx="150" cy="200" r="6" fill="#8a2be2"/>
  <text x="140" y="196" text-anchor="end" font-size="13" font-weight="700" fill="#8a2be2">SERVO</text>
  <text x="140" y="212" text-anchor="end" font-size="11.5" fill="#777" data-pin="Servo signal">pin 0</text>

  <!-- ===== the pin, R1 to ground, and R3 into U1 ===== -->
  <line x1="156" y1="200" x2="246" y2="200" stroke="#8a2be2" stroke-width="2.5"/>
  <text x="162" y="188" font-size="11.5" fill="#666" data-fig="v_3v3">3.3 V pulse</text>
  <circle cx="220" cy="200" r="4" fill="#8a2be2"/>
  <line x1="220" y1="200" x2="220" y2="216" stroke="#8a2be2" stroke-width="2.5"/>
  <rect x="207" y="216" width="26" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="201" y="240" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">R1</text>
  <text x="201" y="258" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="r_pd">10 k&#937;</text>
  <line x1="220" y1="276" x2="220" y2="290" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="206" y1="290" x2="234" y2="290" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="211" y1="296" x2="229" y2="296" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="216" y1="302" x2="224" y2="302" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="246" y="190" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="281" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">R3</text>
  <text x="281" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" data-fig="r_in">2.2 k&#937;</text>
  <line x1="316" y1="200" x2="344" y2="200" stroke="#8a2be2" stroke-width="2.5"/>

  <!-- ===== U1 ===== -->
  <rect x="350" y="140" width="180" height="120" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="440" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#5c4a00">U1</text>
  <text x="440" y="222" text-anchor="middle" font-size="11" fill="#666">CD74HCT125E</text>

  <circle cx="440" cy="140" r="6" fill="#c0392b"/>
  <text x="440" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">VCC</text>
  <text x="440" y="174" text-anchor="middle" font-size="11.5" fill="#777">pin 14</text>
  <circle cx="350" cy="200" r="6" fill="#8a2be2"/>
  <text x="362" y="196" font-size="13" font-weight="700" fill="#8a2be2">A</text>
  <text x="362" y="211" font-size="11.5" fill="#777">pin 2</text>
  <circle cx="530" cy="200" r="6" fill="#8a2be2"/>
  <text x="518" y="196" text-anchor="end" font-size="13" font-weight="700" fill="#8a2be2">Y</text>
  <text x="518" y="211" text-anchor="end" font-size="11.5" fill="#777">pin 3</text>
  <circle cx="380" cy="260" r="6" fill="#1a1a1a"/>
  <text x="380" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">OE</text>
  <text x="380" y="250" text-anchor="middle" font-size="11.5" fill="#777">pin 1</text>
  <circle cx="500" cy="260" r="6" fill="#1a1a1a"/>
  <text x="500" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <text x="500" y="250" text-anchor="middle" font-size="11.5" fill="#777">pin 7</text>

  <line x1="380" y1="266" x2="380" y2="282" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="366" y1="282" x2="394" y2="282" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="371" y1="288" x2="389" y2="288" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="376" y1="294" x2="384" y2="294" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="500" y1="266" x2="500" y2="282" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="486" y1="282" x2="514" y2="282" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="491" y1="288" x2="509" y2="288" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="496" y1="294" x2="504" y2="294" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ===== 5 V from J-PWR to U1, and C2 at U1's supply pin ===== -->
  <line x1="910" y1="180" x2="910" y2="70" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="910" y1="70" x2="440" y2="70" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="440" y1="70" x2="440" y2="134" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="440" cy="86" r="4" fill="#c0392b"/>
  <line x1="440" y1="86" x2="480" y2="86" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="480" y1="86" x2="480" y2="96" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="462" y1="96" x2="498" y2="96" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="462" y1="108" x2="498" y2="108" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="480" y1="108" x2="480" y2="118" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="466" y1="118" x2="494" y2="118" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="471" y1="124" x2="489" y2="124" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="476" y1="130" x2="484" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <text x="503" y="102" font-size="13" font-weight="700" fill="#1a1a1a">C2</text>
  <text x="503" y="120" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="c_bypass">100 nF</text>

  <rect x="338" y="78" width="222" height="224" rx="10" fill="none" stroke="#0a8a6a" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="338" y="320" font-size="11.5" font-weight="700" fill="#0a8a6a" data-fig="place_bypass">keep together, under 10 mm:</text>
  <text x="338" y="336" font-size="11.5" font-weight="700" fill="#0a8a6a">C2 at U1's supply pin</text>

  <!-- ===== U1 through R2 to the servo ===== -->
  <line x1="536" y1="200" x2="576" y2="200" stroke="#8a2be2" stroke-width="2.5"/>
  <rect x="576" y="190" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="611" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">R2</text>
  <text x="611" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" data-fig="r_series">1 k&#937;</text>
  <line x1="646" y1="200" x2="664" y2="200" stroke="#8a2be2" stroke-width="2.5"/>
  <text x="576" y="228" font-size="11.5" fill="#666" data-fig="v_5v">5 V pulse</text>

  <!-- ===== servo ===== -->
  <rect x="670" y="150" width="140" height="100" rx="8" fill="#fbeef5" stroke="#a8437a" stroke-width="2"/>
  <text x="686" y="176" font-size="16" font-weight="700" fill="#7a2556">Servo</text>
  <text x="686" y="238" font-size="11.5" fill="#666">DFRobot SER0049</text>
  <circle cx="670" cy="200" r="6" fill="#8a2be2"/>
  <text x="682" y="204" font-size="13" font-weight="700" fill="#8a2be2">SIG</text>
  <circle cx="810" cy="180" r="6" fill="#c0392b"/>
  <text x="798" y="184" text-anchor="end" font-size="13" font-weight="700" fill="#c0392b">+</text>
  <circle cx="810" cy="220" r="6" fill="#1a1a1a"/>
  <text x="798" y="224" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">&#8722;</text>

  <!-- ===== the servo's pair from J-PWR, and C1 ===== -->
  <line x1="816" y1="180" x2="934" y2="180" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="816" y1="220" x2="934" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="920" cy="220" r="4" fill="#1a1a1a"/>
  <line x1="920" y1="220" x2="920" y2="236" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="908" y1="236" x2="932" y2="236" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="912" y1="242" x2="928" y2="242" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="916" y1="248" x2="924" y2="248" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="910" cy="180" r="4" fill="#c0392b"/>

  <circle cx="860" cy="180" r="4" fill="#c0392b"/>
  <line x1="860" y1="180" x2="860" y2="193" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="842" y1="193" x2="878" y2="193" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 842 211 Q 860 199 878 211" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <text x="836" y="198" text-anchor="end" font-size="15" font-weight="700" fill="#1a1a1a">+</text>
  <line x1="860" y1="205" x2="860" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="860" cy="220" r="4" fill="#1a1a1a"/>
  <text x="860" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">C1</text>
  <text x="860" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="c_bulk">100 &#181;F</text>

  <rect x="824" y="148" width="72" height="100" rx="10" fill="none" stroke="#0a8a6a" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="824" y="266" font-size="11.5" font-weight="700" fill="#0a8a6a" data-fig="place_bulk">keep together, under 20 mm:</text>
  <text x="824" y="282" font-size="11.5" font-weight="700" fill="#0a8a6a">C1 at the servo's cable</text>

  <!-- ===== J-PWR ===== -->
  <rect x="940" y="130" width="80" height="120" rx="8" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2"/>
  <text x="980" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#333333">J-PWR</text>
  <circle cx="940" cy="180" r="6" fill="#c0392b"/>
  <text x="952" y="184" font-size="12.5" font-weight="700" fill="#c0392b" data-fig="v_5v">5 V</text>
  <circle cx="940" cy="220" r="6" fill="#1a1a1a"/>
  <text x="952" y="224" font-size="12.5" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- ===== U1's unused buffers ===== -->
  <rect x="20" y="314" width="300" height="66" rx="6" fill="#fbfaf7" stroke="#8a6d0b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="34" y="334" font-size="12" font-weight="700" fill="#5c4a00">U1, the three unused buffers</text>
  <text x="34" y="352" font-size="11.5" fill="#5c4a00">Pins 4, 5, 9, 10, 12 and 13 to GND</text>
  <text x="34" y="368" font-size="11.5" fill="#5c4a00">Pins 6, 8 and 11 stay unconnected</text>

  <!-- ===== placement ===== -->
  <text x="20" y="410" font-size="13" font-weight="700" fill="#1a1a1a">Placement</text>
  <text x="20" y="432" font-size="12" font-weight="700" fill="#1a1a1a">Group</text>
  <text x="200" y="432" font-size="12" font-weight="700" fill="#1a1a1a">Distance</text>
  <text x="300" y="432" font-size="12" font-weight="700" fill="#1a1a1a">Reason</text>
  <line x1="20" y1="439" x2="640" y2="439" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="457" font-size="11.5" fill="#444">C2 at U1's supply pin</text>
  <text x="200" y="457" font-size="11.5" fill="#444" data-fig="place_bypass">under 10 mm</text>
  <text x="300" y="457" font-size="11.5" fill="#444">the loop from U1's supply pin through C2 stays short</text>
  <text x="20" y="475" font-size="11.5" fill="#444">C1 at the servo's cable</text>
  <text x="200" y="475" font-size="11.5" fill="#444" data-fig="place_bulk">under 20 mm</text>
  <text x="300" y="475" font-size="11.5" fill="#444">C1 takes the supply cable's current at a sudden stop</text>

  <!-- ===== variants ===== -->
  <text x="680" y="410" font-size="13" font-weight="700" fill="#1a1a1a">Package variants</text>
  <text x="680" y="432" font-size="12" font-weight="700" fill="#1a1a1a">Ref</text>
  <text x="716" y="432" font-size="12" font-weight="700" fill="#1a1a1a">Function</text>
  <text x="776" y="432" font-size="12" font-weight="700" fill="#1a1a1a">Through-hole</text>
  <text x="896" y="432" font-size="12" font-weight="700" fill="#1a1a1a">SMD</text>
  <line x1="680" y1="439" x2="1040" y2="439" stroke="#ccc" stroke-width="1"/>
  <text x="680" y="457" font-size="11.5" fill="#444">U1</text>
  <text x="716" y="457" font-size="11.5" fill="#444">Buffer</text>
  <text x="776" y="457" font-size="11.5" fill="#444">CD74HCT125E</text>
  <text x="776" y="473" font-size="11.5" fill="#444">DIP-14</text>
  <text x="896" y="457" font-size="11.5" fill="#444">CD74HCT125M96</text>
  <text x="896" y="473" font-size="11.5" fill="#444">SOIC-14</text>
</svg>
