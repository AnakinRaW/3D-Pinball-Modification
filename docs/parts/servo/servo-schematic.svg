<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Servo</text>
  <text x="30" y="56" font-size="13" fill="#666">The servo board shifts the Teensy's pulse to the servo's level and feeds the servo from the power board</text>

  <!-- ===== J-SERVO from the power board ===== -->
  <rect x="20" y="100" width="130" height="114" rx="8" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2"/>
  <text x="32" y="124" font-size="15" font-weight="700" fill="#333333">J-SERVO</text>
  <text x="32" y="142" font-size="11" fill="#666">from the</text>
  <text x="32" y="156" font-size="11" fill="#666">power board</text>
  <circle cx="150" cy="150" r="6" fill="#c0392b"/>
  <text x="138" y="154" text-anchor="end" font-size="12.5" font-weight="700" fill="#c0392b" data-fig="v_5v">5 V</text>
  <circle cx="150" cy="200" r="6" fill="#1a1a1a"/>
  <text x="138" y="204" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- ===== Teensy ===== -->
  <rect x="20" y="230" width="130" height="100" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="34" y="256" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <circle cx="150" cy="280" r="6" fill="#1f4fd1"/>
  <text x="140" y="276" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">SERVO</text>
  <text x="140" y="292" text-anchor="end" font-size="11.5" fill="#777" data-pin="Servo signal">pin 0</text>
  <circle cx="85" cy="330" r="6" fill="#1a1a1a"/>
  <text x="85" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <line x1="85" y1="336" x2="85" y2="350" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="71" y1="350" x2="99" y2="350" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="76" y1="356" x2="94" y2="356" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="81" y1="362" x2="89" y2="362" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ===== the three wires into the board ===== -->
  <line x1="156" y1="150" x2="264" y2="150" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="156" y1="200" x2="264" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="156" y1="280" x2="264" y2="280" stroke="#1f4fd1" stroke-width="2.5"/>
  <text x="162" y="268" font-size="11.5" fill="#666" data-fig="v_3v3">3.3 V pulse</text>

  <!-- ===== board outline ===== -->
  <rect x="240" y="84" width="750" height="356" rx="12" fill="none" stroke="#8a6d0b" stroke-width="1.5"/>
  <text x="256" y="106" font-size="15" font-weight="700" fill="#5c4a00">Servo board</text>

  <!-- ===== J-PWR ===== -->
  <rect x="270" y="118" width="80" height="186" rx="8" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2"/>
  <text x="310" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#333333">J-PWR</text>
  <circle cx="270" cy="150" r="6" fill="#c0392b"/>
  <circle cx="350" cy="150" r="6" fill="#c0392b"/>
  <text x="310" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" data-fig="v_5v">5 V</text>
  <circle cx="270" cy="200" r="6" fill="#1a1a1a"/>
  <circle cx="350" cy="200" r="6" fill="#1a1a1a"/>
  <text x="310" y="204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">GND</text>
  <circle cx="270" cy="280" r="6" fill="#1f4fd1"/>
  <circle cx="350" cy="280" r="6" fill="#1f4fd1"/>
  <text x="310" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f4fd1">SIG</text>

  <!-- ===== J-PWR's GND onto the board's ground ===== -->
  <line x1="356" y1="200" x2="374" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="374" y1="200" x2="374" y2="214" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="360" y1="214" x2="388" y2="214" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="365" y1="220" x2="383" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="370" y1="226" x2="378" y2="226" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ===== the pin's signal, R1 to ground, and R3 into U1 ===== -->
  <line x1="356" y1="280" x2="420" y2="280" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="390" cy="280" r="4" fill="#1f4fd1"/>
  <line x1="390" y1="280" x2="390" y2="296" stroke="#1f4fd1" stroke-width="2.5"/>
  <rect x="377" y="296" width="26" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="371" y="320" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">R1</text>
  <text x="371" y="338" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="r_pd">10 k&#937;</text>
  <line x1="390" y1="356" x2="390" y2="370" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="376" y1="370" x2="404" y2="370" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="381" y1="376" x2="399" y2="376" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="386" y1="382" x2="394" y2="382" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="420" y="270" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="455" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">R3</text>
  <text x="455" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" data-fig="r_in">2.2 k&#937;</text>
  <line x1="490" y1="280" x2="544" y2="280" stroke="#1f4fd1" stroke-width="2.5"/>

  <!-- ===== U1 ===== -->
  <rect x="550" y="220" width="180" height="120" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="640" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#5c4a00">U1</text>
  <text x="640" y="302" text-anchor="middle" font-size="11" fill="#666">CD74HCT125E</text>

  <circle cx="640" cy="220" r="6" fill="#c0392b"/>
  <text x="640" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">VCC</text>
  <text x="640" y="254" text-anchor="middle" font-size="11.5" fill="#777">pin 14</text>
  <circle cx="550" cy="280" r="6" fill="#1f4fd1"/>
  <text x="562" y="276" font-size="13" font-weight="700" fill="#1f4fd1">A</text>
  <text x="562" y="291" font-size="11.5" fill="#777">pin 2</text>
  <text x="718" y="276" text-anchor="end" font-size="13" font-weight="700" fill="#4d4d4d">Y</text>
  <text x="718" y="291" text-anchor="end" font-size="11.5" fill="#777">pin 3</text>
  <circle cx="580" cy="340" r="6" fill="#1a1a1a"/>
  <text x="580" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">OE</text>
  <text x="580" y="330" text-anchor="middle" font-size="11.5" fill="#777">pin 1</text>
  <circle cx="700" cy="340" r="6" fill="#1a1a1a"/>
  <text x="700" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <text x="700" y="330" text-anchor="middle" font-size="11.5" fill="#777">pin 7</text>

  <line x1="580" y1="346" x2="580" y2="362" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="566" y1="362" x2="594" y2="362" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="571" y1="368" x2="589" y2="368" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="576" y1="374" x2="584" y2="374" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="700" y1="346" x2="700" y2="362" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="686" y1="362" x2="714" y2="362" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="691" y1="368" x2="709" y2="368" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="696" y1="374" x2="704" y2="374" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ===== the 5 V rail from J-PWR to U1, C1 and the servo, and C2 at U1's supply pin ===== -->
  <line x1="356" y1="150" x2="1024" y2="150" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="640" cy="150" r="4" fill="#c0392b"/>
  <line x1="640" y1="150" x2="640" y2="214" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="640" cy="166" r="4" fill="#c0392b"/>
  <line x1="640" y1="166" x2="680" y2="166" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="680" y1="166" x2="680" y2="176" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="662" y1="176" x2="698" y2="176" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="662" y1="188" x2="698" y2="188" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="680" y1="188" x2="680" y2="198" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="666" y1="198" x2="694" y2="198" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="671" y1="204" x2="689" y2="204" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="676" y1="210" x2="684" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <text x="703" y="182" font-size="13" font-weight="700" fill="#1a1a1a">C2</text>
  <text x="703" y="200" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="c_bypass">100 nF</text>

  <rect x="538" y="158" width="222" height="224" rx="10" fill="none" stroke="#0a8a6a" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="538" y="400" font-size="11.5" font-weight="700" fill="#0a8a6a" data-fig="place_bypass">keep together, under 10 mm:</text>
  <text x="538" y="416" font-size="11.5" font-weight="700" fill="#0a8a6a">C2 at U1's supply pin</text>

  <!-- ===== U1 through R2 to the servo ===== -->
  <line x1="736" y1="280" x2="773.5" y2="280" stroke="#808080" stroke-width="5"/>
  <line x1="736" y1="280" x2="776" y2="280" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="776" y="270" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="811" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">R2</text>
  <text x="811" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" data-fig="r_series">1.2 k&#937;</text>
  <line x1="848.5" y1="280" x2="1024" y2="280" stroke="#808080" stroke-width="5"/>
  <line x1="846" y1="280" x2="1024" y2="280" stroke="#ffffff" stroke-width="2.5"/>
  <text x="776" y="308" font-size="11.5" fill="#666" data-fig="v_5v">5 V pulse</text>

  <!-- ===== C1 across the servo's supply, and the servo's ground ===== -->
  <circle cx="900" cy="150" r="4" fill="#c0392b"/>
  <line x1="900" y1="150" x2="900" y2="166" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="882" y1="166" x2="918" y2="166" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 882 184 Q 900 172 918 184" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <text x="876" y="171" text-anchor="end" font-size="15" font-weight="700" fill="#1a1a1a">+</text>
  <line x1="900" y1="178" x2="900" y2="214" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="900" cy="200" r="4" fill="#1a1a1a"/>
  <line x1="886" y1="214" x2="914" y2="214" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="891" y1="220" x2="909" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="896" y1="226" x2="904" y2="226" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="900" y1="200" x2="1024" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="926" y="172" font-size="13" font-weight="700" fill="#1a1a1a">C1</text>
  <text x="926" y="190" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="c_c1">100 &#181;F</text>

  <rect x="860" y="138" width="124" height="96" rx="10" fill="none" stroke="#0a8a6a" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="800" y="114" font-size="11.5" font-weight="700" fill="#0a8a6a" data-fig="place_bulk">keep together, under 20 mm:</text>
  <text x="800" y="130" font-size="11.5" font-weight="700" fill="#0a8a6a">C1 at the servo's cable</text>

  <!-- ===== servo ===== -->
  <rect x="1030" y="96" width="130" height="214" rx="8" fill="#fbeef5" stroke="#a8437a" stroke-width="2"/>
  <text x="1046" y="122" font-size="16" font-weight="700" fill="#7a2556">Servo</text>
  <text x="1046" y="300" font-size="11.5" fill="#666">DFRobot SER0049</text>
  <circle cx="1030" cy="150" r="6" fill="#c0392b"/>
  <text x="1042" y="154" font-size="13" font-weight="700" fill="#c0392b">+</text>
  <circle cx="1030" cy="200" r="6" fill="#1a1a1a"/>
  <text x="1042" y="204" font-size="13" font-weight="700" fill="#1a1a1a">&#8722;</text>
  <text x="1042" y="284" font-size="13" font-weight="700" fill="#4d4d4d">SIG</text>

  <!-- ===== U1's unused buffers ===== -->
  <rect x="20" y="460" width="300" height="66" rx="6" fill="#fbfaf7" stroke="#8a6d0b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="34" y="480" font-size="12" font-weight="700" fill="#5c4a00">U1, the three unused buffers</text>
  <text x="34" y="498" font-size="11.5" fill="#5c4a00">Pins 4, 5, 9, 10, 12 and 13 to GND</text>
  <text x="34" y="514" font-size="11.5" fill="#5c4a00">Pins 6, 8 and 11 stay unconnected</text>

  <!-- ===== placement ===== -->
  <text x="20" y="560" font-size="13" font-weight="700" fill="#1a1a1a">Placement</text>
  <text x="20" y="582" font-size="12" font-weight="700" fill="#1a1a1a">Group</text>
  <text x="200" y="582" font-size="12" font-weight="700" fill="#1a1a1a">Distance</text>
  <text x="300" y="582" font-size="12" font-weight="700" fill="#1a1a1a">Reason</text>
  <line x1="20" y1="589" x2="640" y2="589" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="607" font-size="11.5" fill="#444">C2 at U1's supply pin</text>
  <text x="200" y="607" font-size="11.5" fill="#444" data-fig="place_bypass">under 10 mm</text>
  <text x="300" y="607" font-size="11.5" fill="#444">the loop from U1's supply pin through C2 stays short</text>
  <text x="20" y="625" font-size="11.5" fill="#444">C1 at the servo's cable</text>
  <text x="200" y="625" font-size="11.5" fill="#444" data-fig="place_bulk">under 20 mm</text>
  <text x="300" y="625" font-size="11.5" fill="#444">C1 takes the supply cable's current at a sudden stop</text>

  <!-- ===== pins and junctions of the light wires, on top ===== -->
  <circle cx="730" cy="280" r="6" fill="#ffffff" stroke="#808080" stroke-width="1.5"/>
  <circle cx="1030" cy="280" r="6" fill="#ffffff" stroke="#808080" stroke-width="1.5"/>
</svg>
