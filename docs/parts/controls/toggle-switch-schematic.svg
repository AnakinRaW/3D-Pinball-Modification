<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="330" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Toggle switch</text>
  <text x="30" y="56" font-size="13" fill="#666" data-pin="Toggle switch">The stock toggle switch closes pin 41 to ground, and each game decides what it does</text>

  <!-- Teensy block -->
  <rect x="50" y="100" width="190" height="200" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="64" y="128" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>

  <circle cx="240" cy="170" r="6" fill="#2c3e50"/>
  <text x="230" y="174" text-anchor="end" font-size="13" font-weight="700" fill="#2c3e50">SWITCH</text>
  <text x="230" y="190" text-anchor="end" font-size="11.5" fill="#777" data-pin="Toggle switch">pin 41</text>

  <circle cx="240" cy="260" r="6" fill="#1a1a1a"/>
  <text x="230" y="264" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- the stock switch -->
  <rect x="540" y="110" width="250" height="190" rx="8" fill="#fbeef5" stroke="#a8437a" stroke-width="2"/>
  <text x="640" y="138" font-size="16" font-weight="700" fill="#7a2556">Toggle switch</text>
  <text x="640" y="156" font-size="11.5" fill="#666">stock, from P26</text>
  <circle cx="540" cy="170" r="6" fill="#2c3e50"/>
  <circle cx="540" cy="260" r="6" fill="#1a1a1a"/>
  <line x1="540" y1="170" x2="600" y2="170" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="600" y1="170" x2="600" y2="192" stroke="#2c3e50" stroke-width="2.5"/>
  <circle cx="600" cy="196" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="603" y1="199" x2="626" y2="228" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="600" cy="236" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="600" y1="240" x2="600" y2="260" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="540" y1="260" x2="600" y2="260" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="640" y="214" font-size="11.5" fill="#666" data-pin="Toggle switch">closed: pin 41 reads low</text>
  <text x="640" y="230" font-size="11.5" fill="#666" data-pin="Toggle switch">open: pin 41 reads high</text>

  <!-- R1, in series with the switch pin -->
  <rect x="355" y="160" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="390" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" data-fig="r_s">1.1 kΩ</text>
  <text x="390" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">R1</text>

  <!-- wires -->
  <line x1="240" y1="170" x2="355" y2="170" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="425" y1="170" x2="540" y2="170" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="240" y1="260" x2="540" y2="260" stroke="#1a1a1a" stroke-width="2.5"/>
</svg>
