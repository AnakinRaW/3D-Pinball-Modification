<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Ball drain break beam</text>
  <text x="30" y="56" font-size="13" fill="#666">Emitter and receiver bodies facing each other with a 2 cm gap, wired straight to the Teensy's 3V3 and GND</text>

  <!-- Teensy block -->
  <rect x="50" y="140" width="190" height="200" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="64" y="168" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>

  <circle cx="240" cy="180" r="6" fill="#c0392b"/>
  <text x="230" y="184" text-anchor="end" font-size="13" font-weight="700" fill="#c0392b">3V3</text>

  <circle cx="240" cy="240" r="6" fill="#2c3e50"/>
  <text x="230" y="244" text-anchor="end" font-size="13" font-weight="700" fill="#2c3e50">PIN 40</text>

  <circle cx="240" cy="300" r="6" fill="#1a1a1a"/>
  <text x="230" y="304" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- Emitter body -->
  <rect x="560" y="140" width="210" height="110" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="574" y="168" font-size="16" font-weight="700" fill="#5c4a00">Emitter body</text>
  <text x="574" y="186" font-size="11.5" fill="#666">3 mm IR LED, 10 mA</text>

  <circle cx="560" cy="205" r="6" fill="#c0392b"/>
  <text x="572" y="209" font-size="13" font-weight="700" fill="#c0392b">VCC</text>

  <circle cx="560" cy="228" r="6" fill="#1a1a1a"/>
  <text x="572" y="232" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- Receiver body -->
  <rect x="560" y="290" width="210" height="150" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="574" y="318" font-size="16" font-weight="700" fill="#5c4a00">Receiver body</text>
  <text x="574" y="336" font-size="11.5" fill="#666">3 mm, open collector, 10 mA</text>

  <circle cx="560" cy="360" r="6" fill="#c0392b"/>
  <text x="572" y="364" font-size="13" font-weight="700" fill="#c0392b">VCC</text>

  <circle cx="560" cy="384" r="6" fill="#1a1a1a"/>
  <text x="572" y="388" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <circle cx="560" cy="408" r="6" fill="#2c3e50"/>
  <text x="572" y="412" font-size="13" font-weight="700" fill="#2c3e50">OUT</text>
  <text x="574" y="426" font-size="10.5" fill="#666">LOW = beam blocked</text>

  <!-- 3V3 net -->
  <line x1="240" y1="180" x2="480" y2="180" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="480" y1="180" x2="480" y2="360" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="480" cy="205" r="4" fill="#c0392b"/>
  <line x1="480" y1="205" x2="560" y2="205" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="480" y1="360" x2="560" y2="360" stroke="#c0392b" stroke-width="2.5"/>

  <text data-fig="v_3v3" x="300" y="172" font-size="12.5" font-weight="700" fill="#c0392b">3.3 V</text>

  <!-- GND net -->
  <line x1="240" y1="300" x2="440" y2="300" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="440" y1="228" x2="440" y2="384" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="440" cy="300" r="4" fill="#1a1a1a"/>
  <line x1="440" y1="228" x2="560" y2="228" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="440" y1="384" x2="560" y2="384" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- signal: receiver OUT to Teensy pin 40 -->
  <line x1="560" y1="408" x2="400" y2="408" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="400" y1="408" x2="400" y2="240" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="400" y1="240" x2="240" y2="240" stroke="#2c3e50" stroke-width="2.5"/>
</svg>
