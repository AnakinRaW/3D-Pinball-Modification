<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="950" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Display</text>
  <text x="30" y="56" font-size="13" fill="#666">The Teensy writes the Adafruit 2090 over an 8-bit bus and reads its touch controller over I²C through a level converter. The module runs from the power board</text>

  <!-- Teensy block -->
  <rect x="40" y="100" width="230" height="700" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="54" y="128" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <text x="54" y="146" font-size="11.5" fill="#666">FlexIO3 and Wire2</text>

  <!-- module block -->
  <rect x="720" y="100" width="330" height="810" rx="8" fill="#fbeef5" stroke="#a8437a" stroke-width="2"/>
  <text x="1036" y="128" text-anchor="end" font-size="16" font-weight="700" fill="#7a2556">Adafruit 2090</text>


  <circle cx="270" cy="220" r="6" fill="#1f4fd1"/>
  <text x="258" y="219" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D0</text>
  <text x="258" y="234" text-anchor="end" font-size="11.5" fill="#777" data-pin="D0 to the display">pin 22</text>
  <line x1="276" y1="220" x2="714" y2="220" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="220" r="6" fill="#1f4fd1"/>
  <text x="732" y="225" font-size="13" font-weight="700" fill="#1f4fd1">D0</text>

  <circle cx="270" cy="256" r="6" fill="#1f4fd1"/>
  <text x="258" y="255" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D1</text>
  <text x="258" y="270" text-anchor="end" font-size="11.5" fill="#777" data-pin="D1 to the display">pin 23</text>
  <line x1="276" y1="256" x2="714" y2="256" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="256" r="6" fill="#1f4fd1"/>
  <text x="732" y="261" font-size="13" font-weight="700" fill="#1f4fd1">D1</text>

  <circle cx="270" cy="292" r="6" fill="#1f4fd1"/>
  <text x="258" y="291" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D2</text>
  <text x="258" y="306" text-anchor="end" font-size="11.5" fill="#777" data-pin="D2 to the display">pin 20</text>
  <line x1="276" y1="292" x2="714" y2="292" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="292" r="6" fill="#1f4fd1"/>
  <text x="732" y="297" font-size="13" font-weight="700" fill="#1f4fd1">D2</text>

  <circle cx="270" cy="328" r="6" fill="#1f4fd1"/>
  <text x="258" y="327" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D3</text>
  <text x="258" y="342" text-anchor="end" font-size="11.5" fill="#777" data-pin="D3 to the display">pin 21</text>
  <line x1="276" y1="328" x2="714" y2="328" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="328" r="6" fill="#1f4fd1"/>
  <text x="732" y="333" font-size="13" font-weight="700" fill="#1f4fd1">D3</text>

  <circle cx="270" cy="364" r="6" fill="#1f4fd1"/>
  <text x="258" y="363" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D4</text>
  <text x="258" y="378" text-anchor="end" font-size="11.5" fill="#777" data-pin="D4 to the display">pin 38</text>
  <line x1="276" y1="364" x2="714" y2="364" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="364" r="6" fill="#1f4fd1"/>
  <text x="732" y="369" font-size="13" font-weight="700" fill="#1f4fd1">D4</text>

  <circle cx="270" cy="400" r="6" fill="#1f4fd1"/>
  <text x="258" y="399" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D5</text>
  <text x="258" y="414" text-anchor="end" font-size="11.5" fill="#777" data-pin="D5 to the display">pin 39</text>
  <line x1="276" y1="400" x2="714" y2="400" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="400" r="6" fill="#1f4fd1"/>
  <text x="732" y="405" font-size="13" font-weight="700" fill="#1f4fd1">D5</text>

  <circle cx="270" cy="436" r="6" fill="#1f4fd1"/>
  <text x="258" y="435" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D6</text>
  <text x="258" y="450" text-anchor="end" font-size="11.5" fill="#777" data-pin="D6 to the display">pin 26</text>
  <line x1="276" y1="436" x2="714" y2="436" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="436" r="6" fill="#1f4fd1"/>
  <text x="732" y="441" font-size="13" font-weight="700" fill="#1f4fd1">D6</text>

  <circle cx="270" cy="472" r="6" fill="#1f4fd1"/>
  <text x="258" y="471" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D7</text>
  <text x="258" y="486" text-anchor="end" font-size="11.5" fill="#777" data-pin="D7 to the display">pin 27</text>
  <line x1="276" y1="472" x2="714" y2="472" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="472" r="6" fill="#1f4fd1"/>
  <text x="732" y="477" font-size="13" font-weight="700" fill="#1f4fd1">D7</text>

  <circle cx="270" cy="524" r="6" fill="#1f4fd1"/>
  <text x="258" y="523" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">WR</text>
  <text x="258" y="538" text-anchor="end" font-size="11.5" fill="#777" data-pin="WR to the display">pin 17</text>
  <line x1="276" y1="524" x2="714" y2="524" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="524" r="6" fill="#1f4fd1"/>
  <text x="732" y="529" font-size="13" font-weight="700" fill="#1f4fd1">WR</text>

  <circle cx="270" cy="560" r="6" fill="#1f4fd1"/>
  <text x="258" y="559" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">CS</text>
  <text x="258" y="574" text-anchor="end" font-size="11.5" fill="#777" data-pin="CS to the display controller">pin 28</text>
  <line x1="276" y1="560" x2="714" y2="560" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="560" r="6" fill="#1f4fd1"/>
  <text x="732" y="565" font-size="13" font-weight="700" fill="#1f4fd1">CS</text>

  <circle cx="270" cy="596" r="6" fill="#1f4fd1"/>
  <text x="258" y="595" text-anchor="end" font-size="13" font-weight="700" fill="#1f4fd1">D/C</text>
  <text x="258" y="610" text-anchor="end" font-size="11.5" fill="#777" data-pin="D/C to the display">pin 29</text>
  <line x1="276" y1="596" x2="714" y2="596" stroke="#1f4fd1" stroke-width="2.5"/>
  <circle cx="720" cy="596" r="6" fill="#1f4fd1"/>
  <text x="732" y="601" font-size="13" font-weight="700" fill="#1f4fd1">C/D</text>

  <!-- the bus's ground, from the Teensy straight to the module -->
  <circle cx="270" cy="632" r="6" fill="#1a1a1a"/>
  <text x="258" y="637" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <line x1="276" y1="632" x2="714" y2="632" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="720" cy="632" r="6" fill="#1a1a1a"/>
  <text x="732" y="637" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- the touch cable, from the Teensy to the display board -->
  <text x="258" y="711" text-anchor="end" font-size="13" font-weight="700" fill="#4d4d4d">SDA</text>
  <text x="258" y="726" text-anchor="end" font-size="11.5" fill="#777" data-pin="SDA to the touch controller">pin 25</text>
  <line x1="276" y1="712" x2="424" y2="712" stroke="#808080" stroke-width="5"/>
  <line x1="276" y1="712" x2="424" y2="712" stroke="#ffffff" stroke-width="2.5"/>

  <text x="258" y="747" text-anchor="end" font-size="13" font-weight="700" fill="#4d4d4d">SCL</text>
  <text x="258" y="762" text-anchor="end" font-size="11.5" fill="#777" data-pin="SCL to the touch controller">pin 24</text>
  <line x1="276" y1="748" x2="424" y2="748" stroke="#808080" stroke-width="5"/>
  <line x1="276" y1="748" x2="424" y2="748" stroke="#ffffff" stroke-width="2.5"/>

  <text x="258" y="789" text-anchor="end" font-size="13" font-weight="700" fill="#8a6d0b">3V3</text>
  <line x1="276" y1="784" x2="424" y2="784" stroke="#9a7d0a" stroke-width="5"/>
  <line x1="276" y1="784" x2="424" y2="784" stroke="#f1c40f" stroke-width="2.5"/>

  <!-- ===== display board ===== -->
  <rect x="330" y="650" width="350" height="270" rx="12" fill="none" stroke="#8a6d0b" stroke-width="1.5"/>
  <text x="346" y="674" font-size="15" font-weight="700" fill="#5c4a00">Display board</text>

  <!-- the converter as a daughter board, its LV side on the Teensy's 3V3, its HV side on the board's 5 V -->
  <rect x="430" y="684" width="160" height="116" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="510" y="732" text-anchor="middle" font-size="13" font-weight="700" fill="#5c4a00">Adafruit 757</text>
  <text x="510" y="766" text-anchor="middle" font-size="10.5" fill="#666">a BSS138 per line</text>
  <text x="442" y="788" font-size="11" font-weight="700" fill="#8a6d0b">LV</text>
  <circle cx="590" cy="784" r="6" fill="#c0392b"/>
  <text x="578" y="788" text-anchor="end" font-size="11" font-weight="700" fill="#c0392b">HV</text>
  <circle cx="510" cy="800" r="6" fill="#1a1a1a"/>
  <text x="510" y="792" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">GND</text>
  <line x1="510" y1="806" x2="510" y2="820" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="496" y1="820" x2="524" y2="820" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="501" y1="826" x2="519" y2="826" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="506" y1="832" x2="514" y2="832" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="596" y1="712" x2="714" y2="712" stroke="#808080" stroke-width="5"/>
  <line x1="596" y1="748" x2="714" y2="748" stroke="#808080" stroke-width="5"/>
  <line x1="596" y1="712" x2="714" y2="712" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="596" y1="748" x2="714" y2="748" stroke="#ffffff" stroke-width="2.5"/>

  <!-- HV onto the board's 5 V -->
  <line x1="596" y1="784" x2="630" y2="784" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="630" y1="784" x2="630" y2="846" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="630" cy="846" r="4" fill="#c0392b"/>

  <!-- J-PWR, fed from the power board's J-DISP -->
  <rect x="350" y="812" width="90" height="88" rx="8" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2"/>
  <text x="395" y="832" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">J-PWR</text>
  <circle cx="350" cy="846" r="6" fill="#c0392b"/>
  <circle cx="440" cy="846" r="6" fill="#c0392b"/>
  <text x="395" y="850" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" data-fig="v_rail">5 V</text>
  <circle cx="350" cy="880" r="6" fill="#1a1a1a"/>
