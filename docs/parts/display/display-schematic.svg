  <polyline points="780,212 786,212 786,604 780,604" fill="none" stroke="#999" stroke-width="1"/>
  <text x="796" y="412" font-size="12.5" font-weight="700" fill="#666">display</text>
  <polyline points="780,704 786,704 786,756 780,756" fill="none" stroke="#999" stroke-width="1"/>
  <text x="796" y="734" font-size="12.5" font-weight="700" fill="#666">touch</text>

