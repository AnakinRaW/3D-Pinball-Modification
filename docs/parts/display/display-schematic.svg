  <line x1="1056" y1="330" x2="1100" y2="330" stroke="#f1c40f" stroke-width="2.5"/>
  <line x1="1056" y1="380" x2="1102.5" y2="380" stroke="#9a7d0a" stroke-width="5"/>
  <line x1="1056" y1="380" x2="1100" y2="380" stroke="#f1c40f" stroke-width="2.5"/>
  <line x1="1056" y1="430" x2="1100" y2="430" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="1100" y1="430" x2="1100" y2="446" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="1086" y1="446" x2="1114" y2="446" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="1091" y1="452" x2="1109" y2="452" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="1096" y1="458" x2="1104" y2="458" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1064" y="505" font-size="11.5" fill="#777">unconnected</text>
  <text x="1064" y="545" font-size="11.5" fill="#777">unconnected</text>
  <text x="1064" y="585" font-size="11.5" fill="#777">unconnected</text>
