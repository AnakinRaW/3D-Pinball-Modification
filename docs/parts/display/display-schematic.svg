  <text x="796" y="412" font-size="12.5" font-weight="700" fill="#666">display</text>
  <polyline points="780,640 786,640 786,692 780,692" fill="none" stroke="#999" stroke-width="1"/>
  <text x="796" y="670" font-size="12.5" font-weight="700" fill="#666">touch</text>

