  <line x1="276" y1="220" x2="714" y2="220" stroke="#2c3e50" stroke-width="2.5"/>
  <circle cx="720" cy="220" r="6" fill="#2c3e50"/>
  <text x="732" y="225" font-size="13" font-weight="700" fill="#2c3e50">D0</text>

