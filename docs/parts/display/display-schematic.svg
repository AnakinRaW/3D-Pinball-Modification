  <text x="268" y="884" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a1a">GND</text>
  <line x1="286" y1="846" x2="344" y2="846" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="286" y1="880" x2="344" y2="880" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="150" y="916" font-size="11.5" fill="#c0392b" data-fig="i_disp">at most 198 mA</text>

