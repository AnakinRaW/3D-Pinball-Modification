<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Display</text>
  <text x="30" y="56" font-size="13" fill="#666">The Teensy writes the Adafruit 2090 over an 8-bit bus and reads its touch controller over I²C. The module runs from the Teensy's 3V3</text>

  <!-- Teensy block -->
  <rect x="40" y="100" width="230" height="660" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="54" y="128" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <text x="54" y="146" font-size="11.5" fill="#666">FlexIO3 and Wire2</text>

  <!-- module block -->
  <rect x="720" y="100" width="330" height="660" rx="8" fill="#fbeef5" stroke="#a8437a" stroke-width="2"/>
  <text x="1036" y="128" text-anchor="end" font-size="16" font-weight="700" fill="#7a2556">Adafruit 2090</text>

