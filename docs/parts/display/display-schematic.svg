  <text x="732" y="717" font-size="13" font-weight="700" fill="#4d4d4d">SDA</text>
  <text x="732" y="753" font-size="13" font-weight="700" fill="#4d4d4d">SCL</text>
  <circle cx="720" cy="846" r="6" fill="#c0392b"/>
  <text x="732" y="851" font-size="13" font-weight="700" fill="#c0392b">Vin</text>
  <circle cx="720" cy="880" r="6" fill="#1a1a1a"/>
  <text x="732" y="885" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>


