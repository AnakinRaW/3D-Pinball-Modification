  <line x1="1100" y1="84" x2="1100" y2="380" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="1056" y1="330" x2="1100" y2="330" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="1100" cy="330" r="4" fill="#c0392b"/>
  <line x1="1056" y1="380" x2="1100" y2="380" stroke="#c0392b" stroke-width="2.5"/>
