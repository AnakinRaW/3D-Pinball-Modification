  <text x="1010" y="1122" font-size="11.5" fill="#444" data-fig="place_gate">under 10 mm</text>
  <text x="1130" y="1122" font-size="11.5" fill="#444">gate loop pickup</text>
  <text x="820" y="1144" font-size="11.5" fill="#444">R31, C1 at J-M</text>
  <text x="1010" y="1144" font-size="11.5" fill="#444" data-fig="place_filter">under 15 mm</text>
  <text x="1130" y="1144" font-size="11.5" fill="#444">filters where the wire lands</text>
