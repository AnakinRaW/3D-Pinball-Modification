  <text x="56" y="252" font-size="11.5" fill="#777" data-fig="v_3v3 v_not_tolerant">3.3 V logic, not 5 V tolerant</text>

  <circle cx="240" cy="295" r="6" fill="#8a2be2"/>
  <text x="225" y="291" text-anchor="end" font-size="13" font-weight="700" fill="#8a2be2">TRIGGER 1</text>
  <text x="225" y="307" text-anchor="end" font-size="11.5" fill="#777">pin 32</text>

  <circle cx="240" cy="560" r="6" fill="#c0392b"/>
  <text x="225" y="564" text-anchor="end" font-size="13" font-weight="700" fill="#c0392b" data-fig="v_3v3">3.3 V</text>

  <circle cx="240" cy="620" r="6" fill="#2c3e50"/>
  <text x="225" y="616" text-anchor="end" font-size="13" font-weight="700" fill="#2c3e50">SENSE 1</text>
  <text x="225" y="632" text-anchor="end" font-size="11.5" fill="#777">pin 1</text>

  <circle cx="240" cy="700" r="6" fill="#1a1a1a"/>
  <text x="225" y="704" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- ===== J-T boundary ===== -->
