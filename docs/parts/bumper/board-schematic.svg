  <text x="54" y="880" font-size="11.5" fill="#5c4a00">Channel 4 drives a solenoid and has no sense</text>

  <!-- ===== Variants ===== -->
  <text x="40" y="1070" font-size="13" font-weight="700" fill="#1a1a1a">Package variants</text>
  <text x="40" y="1094" font-size="12" font-weight="700" fill="#1a1a1a">Ref</text>
