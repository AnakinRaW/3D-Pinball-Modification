  <text x="180" y="1144" font-size="11.5" fill="#444">Flyback across the coil</text>
  <text x="380" y="1144" font-size="11.5" fill="#444">1N5819, DO-41</text>
  <text x="580" y="1144" font-size="11.5" fill="#444">1N5819WS, SOD-323</text>

  <!-- ===== Placement ===== -->
  <text x="820" y="1070" font-size="13" font-weight="700" fill="#1a1a1a">Placement</text>
  <text x="820" y="1094" font-size="12" font-weight="700" fill="#1a1a1a">Group</text>
  <text x="1010" y="1094" font-size="12" font-weight="700" fill="#1a1a1a">Distance</text>
  <text x="1130" y="1094" font-size="12" font-weight="700" fill="#1a1a1a">Reason</text>
