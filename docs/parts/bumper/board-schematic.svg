  <text x="1010" y="1166" font-size="11.5" fill="#444" data-fig="place_flyback">under 20 mm</text>
  <text x="1130" y="1166" font-size="11.5" fill="#444">the flyback loop</text>
  <text x="820" y="1192" font-size="11.5" fill="#666">All three distances are assumptions, not datasheet figures.</text>
</svg>
