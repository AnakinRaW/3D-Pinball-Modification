<svg viewBox="0 0 1360 1230" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1360" height="1230" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Bumper board</text>
  <text x="30" y="56" font-size="13" fill="#666">One drive channel and one sense channel drawn in full; the repeats are identical</text>
  <text x="30" y="76" font-size="13" fill="#666">The last digit of a designator is the channel</text>

  <!-- ===== Teensy ===== -->
