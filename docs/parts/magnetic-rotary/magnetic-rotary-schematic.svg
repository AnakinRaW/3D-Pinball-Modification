<svg viewBox="0 0 660 569" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="569" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Magnetic rotary sensor</text>
  <text x="30" y="56" font-size="13" fill="#666">The AS5600 module reads the angle of the magnet on the seal rod and sends it to the Teensy</text>

  <!-- Teensy block -->
  <rect x="110" y="90" width="450" height="100" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="124" y="118" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <!-- one bracket over both bus pins, so the bus label belongs to SDA and SCL together -->
  <polyline points="372,146 372,140 528,140 528,146" fill="none" stroke="#999" stroke-width="1"/>
  <text x="450" y="133" text-anchor="middle" font-size="11.5" fill="#666" data-fig="f_scl">Wire, 100 kHz</text>

  <text x="190" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d0b">3V3</text>

  <circle cx="290" cy="190" r="6" fill="#1a1a1a"/>
  <text x="290" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

  <text x="390" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#4d4d4d">SDA</text>
  <text x="390" y="176" text-anchor="middle" font-size="11.5" fill="#777" data-pin="SDA on Wire">pin 18</text>

  <text x="510" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#4d4d4d">SCL</text>
  <text x="510" y="176" text-anchor="middle" font-size="11.5" fill="#777" data-pin="SCL on Wire">pin 19</text>

  <!-- wires -->
  <line x1="190" y1="190" x2="190" y2="330" stroke="#9a7d0a" stroke-width="5" data-net="3V3"/>
  <line x1="190" y1="190" x2="190" y2="330" stroke="#f1c40f" stroke-width="2.5" data-net="3V3" data-ends="A1.VCC"/>
  <line x1="290" y1="190" x2="290" y2="330" stroke="#1a1a1a" stroke-width="2.5" data-net="GND" data-ends="A1.GND"/>
  <line x1="390" y1="190" x2="390" y2="330" stroke="#808080" stroke-width="5" data-net="SDA"/>
  <line x1="510" y1="190" x2="510" y2="330" stroke="#808080" stroke-width="5" data-net="SCL"/>
  <line x1="390" y1="190" x2="390" y2="330" stroke="#ffffff" stroke-width="2.5" data-net="SDA" data-ends="A1.SDA"/>
  <line x1="510" y1="190" x2="510" y2="330" stroke="#ffffff" stroke-width="2.5" data-net="SCL" data-ends="A1.SCL"/>

  <!-- Grove AS5600 module -->
  <rect x="110" y="330" width="450" height="100" rx="8" fill="#fbeef5" stroke="#a8437a" stroke-width="2" data-part="A1"/>
  <text x="190" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d0b">VCC</text>
  <circle cx="290" cy="330" r="6" fill="#1a1a1a"/>
  <text x="290" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <text x="390" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#4d4d4d">SDA</text>
  <text x="510" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#4d4d4d">SCL</text>
  <text x="124" y="394" font-size="16" font-weight="700" fill="#7a2556">Grove AS5600</text>
  <text x="124" y="412" font-size="11.5" fill="#666">Seeed 101020692</text>


  <!-- ===== parts ===== -->
  <text x="30" y="465" font-size="13" font-weight="700" fill="#1a1a1a">Parts</text>
  <text x="30" y="489" font-size="12" font-weight="700" fill="#1a1a1a">Ref</text>
  <text x="160" y="489" font-size="12" font-weight="700" fill="#1a1a1a">Part</text>
  <text x="470" y="489" font-size="12" font-weight="700" fill="#1a1a1a">Qty</text>
  <line x1="30" y1="497" x2="520" y2="497" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="517" font-size="11.5" fill="#444">Rotary sensor</text>
  <text x="160" y="517" font-size="11.5" fill="#444">Seeed Grove AS5600 module, 101020692</text>
  <text x="470" y="517" font-size="11.5" fill="#444">1</text>
  <text x="30" y="539" font-size="11.5" fill="#444">Rod-end magnet</text>
  <text x="160" y="539" font-size="11.5" fill="#444" data-fig="d_magnet">Disc magnet, 6 mm, diametrically magnetized</text>
  <text x="470" y="539" font-size="11.5" fill="#444">1</text>

  <!-- ===== pins and junctions of the light wires, on top ===== -->
  <circle cx="190" cy="190" r="6" fill="#f1c40f" stroke="#9a7d0a" stroke-width="1.5"/>
  <circle cx="390" cy="190" r="6" fill="#ffffff" stroke="#808080" stroke-width="1.5"/>
  <circle cx="510" cy="190" r="6" fill="#ffffff" stroke="#808080" stroke-width="1.5"/>
  <circle cx="190" cy="330" r="6" fill="#f1c40f" stroke="#9a7d0a" stroke-width="1.5"/>
  <circle cx="390" cy="330" r="6" fill="#ffffff" stroke="#808080" stroke-width="1.5"/>
  <circle cx="510" cy="330" r="6" fill="#ffffff" stroke="#808080" stroke-width="1.5"/>
</svg>
