  <circle cx="255" cy="300" r="5" fill="#1a1a1a"/>

  <line x1="255" y1="330" x2="204" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="255" cy="330" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="330" r="4" fill="#1a1a1a"/>
  <text x="188" y="334" text-anchor="end" font-size="11.5" fill="#333">IR mainboard, J-T</text>
  <line x1="255" y1="370" x2="204" y2="370" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="255" cy="370" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="370" r="4" fill="#1a1a1a"/>
