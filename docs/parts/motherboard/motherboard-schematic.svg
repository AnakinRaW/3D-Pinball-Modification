<svg viewBox="0 0 1220 830" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1220" height="830" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Teensy motherboard</text>
  <text x="30" y="56" font-size="13" fill="#666">The Teensy and the DFR0954 in socket headers, the supply through D1, the 3V3 and GND rails, and the resistors R1 to R4</text>

  <!-- ===== board outline ===== -->
  <rect x="200" y="80" width="840" height="720" rx="12" fill="none" stroke="#8a6d0b" stroke-width="1.5"/>
  <text x="216" y="104" font-size="15" font-weight="700" fill="#5c4a00">Teensy motherboard</text>

  <!-- ===== J-MAIN from the power board ===== -->
  <rect x="30" y="150" width="130" height="100" rx="8" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2"/>
  <text x="42" y="172" font-size="13" font-weight="700" fill="#333333">J-MAIN</text>
  <text x="42" y="188" font-size="11" fill="#666">from the</text>
  <text x="42" y="202" font-size="11" fill="#666">power board</text>
  <circle cx="160" cy="190" r="6" fill="#c0392b"/>
  <text x="150" y="195" text-anchor="end" font-size="12.5" font-weight="700" fill="#c0392b" data-fig="lighting:v_rail">5 V</text>
  <circle cx="160" cy="230" r="6" fill="#1a1a1a"/>
  <text x="150" y="235" text-anchor="end" font-size="12.5" font-weight="700" fill="#1a1a1a">GND</text>
  <line x1="166" y1="190" x2="224" y2="190" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="166" y1="230" x2="224" y2="230" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- ===== J-PWR ===== -->
  <rect x="230" y="150" width="90" height="110" rx="8" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2"/>
  <text x="275" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">J-PWR</text>
  <circle cx="230" cy="190" r="6" fill="#c0392b"/>
  <circle cx="320" cy="190" r="6" fill="#c0392b"/>
  <text x="275" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" data-fig="lighting:v_rail">5 V</text>
  <circle cx="230" cy="230" r="6" fill="#1a1a1a"/>
  <circle cx="255" cy="260" r="6" fill="#1a1a1a"/>
  <text x="275" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- ===== D1 from J-PWR's 5 V to the Teensy's VIN ===== -->
  <line x1="326" y1="190" x2="390" y2="190" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="350" cy="190" r="4" fill="#c0392b"/>
  <polygon points="390,179 390,201 410,190" fill="#1a1a1a"/>
  <line x1="411" y1="178" x2="411" y2="202" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="411" y1="178" x2="403" y2="178" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="411" y1="202" x2="419" y2="202" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="412" y1="190" x2="514" y2="190" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="460" cy="190" r="4" fill="#c0392b"/>
  <text x="400" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">D1</text>
  <text x="400" y="158" text-anchor="middle" font-size="11" fill="#666">1N5819</text>

  <!-- ===== R2, from the supply behind D1 to the break beam's emitter ===== -->
  <line x1="460" y1="190" x2="460" y2="124" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="460" y1="124" x2="860" y2="124" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="860" y="114" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="895" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" data-fig="break-beam:r_e">220 Ω</text>
  <text x="870" y="106" font-size="13" font-weight="700" fill="#1a1a1a">R2</text>
  <line x1="930" y1="124" x2="1036" y2="124" stroke="#b7950b" stroke-width="2.5"/>
  <circle cx="1040" cy="124" r="4" fill="#b7950b"/>
  <text x="1052" y="128" font-size="11.5" fill="#333">break beam, emitter</text>

  <!-- ===== Teensy ===== -->
  <rect x="520" y="150" width="200" height="340" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="534" y="174" font-size="16" font-weight="700" fill="#2c3e50">Teensy 4.1</text>
  <circle cx="520" cy="190" r="6" fill="#c0392b"/>
  <text x="532" y="198" font-size="13" font-weight="700" fill="#c0392b">VIN</text>
  <circle cx="520" cy="300" r="6" fill="#1a1a1a"/>
  <text x="532" y="304" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <text x="532" y="320" font-size="11.5" fill="#777">all three pins</text>
  <circle cx="720" cy="190" r="6" fill="#c0392b"/>
  <text x="708" y="194" text-anchor="end" font-size="13" font-weight="700" fill="#c0392b">3V3</text>
  <text x="708" y="210" text-anchor="end" font-size="11.5" fill="#777">both pins</text>
  <circle cx="720" cy="400" r="6" fill="#2c3e50"/>
  <text x="708" y="404" text-anchor="end" font-size="13" font-weight="700" fill="#2c3e50">BEAM</text>
  <text x="708" y="418" text-anchor="end" font-size="11.5" fill="#777" data-pin="Receiver output of the ball drain gate">pin 31</text>
  <circle cx="720" cy="450" r="6" fill="#2c3e50"/>
  <text x="708" y="454" text-anchor="end" font-size="13" font-weight="700" fill="#2c3e50">SWITCH</text>
  <text x="708" y="468" text-anchor="end" font-size="11.5" fill="#777" data-pin="Toggle switch">pin 32</text>
  <circle cx="550" cy="490" r="6" fill="#2c3e50"/>
  <text x="550" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">DIN</text>
  <text x="550" y="476" text-anchor="middle" font-size="11.5" fill="#777" data-pin="DIN to the DFR0954">pin 2</text>
  <circle cx="590" cy="490" r="6" fill="#8a2be2"/>
  <text x="590" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#8a2be2">LRC</text>
  <text x="590" y="476" text-anchor="middle" font-size="11.5" fill="#777" data-pin="LRC to the DFR0954">pin 3</text>
  <circle cx="630" cy="490" r="6" fill="#8a2be2"/>
  <text x="630" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#8a2be2">BCLK</text>
  <text x="630" y="476" text-anchor="middle" font-size="11.5" fill="#777" data-pin="BCLK to the DFR0954">pin 4</text>
  <!-- D2 across the cut VUSB-VIN trace on the underside -->
  <text x="630" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">D2</text>
  <text x="630" y="242" text-anchor="middle" font-size="11" fill="#666">1N5819WS</text>
  <line x1="590" y1="281" x2="590" y2="262" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="590" y1="262" x2="621" y2="262" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="621" y1="250" x2="621" y2="274" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="621" y1="250" x2="629" y2="250" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="621" y1="274" x2="613" y2="274" stroke="#1a1a1a" stroke-width="3"/>
  <polygon points="622,262 642,251 642,273" fill="#1a1a1a"/>
  <line x1="642" y1="262" x2="670" y2="262" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="670" y1="262" x2="670" y2="281" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="585" y="281" width="10" height="10" fill="#c0392b"/>
  <rect x="665" y="281" width="10" height="10" fill="#c0392b"/>
  <line x1="595" y1="286" x2="622" y2="286" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="638" y1="286" x2="665" y2="286" stroke="#c0392b" stroke-width="2.5"/>
  <text x="590" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b">VIN</text>
  <text x="670" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b">VUSB</text>

