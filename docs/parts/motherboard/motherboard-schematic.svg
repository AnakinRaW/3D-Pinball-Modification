  <circle cx="840" cy="240" r="4" fill="#c0392b"/>
  <circle cx="1040" cy="240" r="4" fill="#c0392b"/>
  <text x="1052" y="244" font-size="11.5" fill="#333">display touch cable</text>

  <!-- ===== R3, from the 3V3 rail to pin 31, and the break beam's receiver ===== -->
  <line x1="840" y1="242" x2="840" y2="300" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="827" y="300" width="26" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="861" y="324" font-size="13" font-weight="700" fill="#1a1a1a">R3</text>
  <text x="861" y="342" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="break-beam:r_pu">100 kΩ</text>
  <line x1="840" y1="360" x2="840" y2="400" stroke="#2c3e50" stroke-width="2.5"/>
  <circle cx="840" cy="400" r="4" fill="#2c3e50"/>
  <line x1="726" y1="400" x2="1036" y2="400" stroke="#2c3e50" stroke-width="2.5"/>
  <circle cx="1040" cy="400" r="4" fill="#2c3e50"/>
  <text x="1052" y="404" font-size="11.5" fill="#333">break beam, receiver</text>

  <!-- ===== R1, in series with the toggle switch ===== -->
  <line x1="726" y1="450" x2="920" y2="450" stroke="#2c3e50" stroke-width="2.5"/>
  <rect x="920" y="440" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="955" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" data-fig="r_s">1.1 kΩ</text>
  <text x="955" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">R1</text>
  <line x1="990" y1="450" x2="1036" y2="450" stroke="#2c3e50" stroke-width="2.5"/>
  <circle cx="1040" cy="450" r="4" fill="#2c3e50"/>
  <text x="1052" y="454" font-size="11.5" fill="#333">toggle switch</text>

  <!-- ===== DFR0954, the second daughter board ===== -->
  <rect x="780" y="540" width="180" height="160" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="885" y="566" text-anchor="middle" font-size="16" font-weight="700" fill="#5c4a00">DFR0954</text>
  <text x="885" y="582" text-anchor="middle" font-size="11.5" fill="#666">MAX98357A</text>
  <circle cx="780" cy="560" r="6" fill="#8a2be2"/>
  <text x="792" y="564" font-size="13" font-weight="700" fill="#8a2be2">BCLK</text>
  <circle cx="780" cy="590" r="6" fill="#8a2be2"/>
  <text x="792" y="594" font-size="13" font-weight="700" fill="#8a2be2">LRC</text>
  <circle cx="780" cy="620" r="6" fill="#2c3e50"/>
  <text x="792" y="624" font-size="13" font-weight="700" fill="#2c3e50">DIN</text>
  <circle cx="780" cy="660" r="6" fill="#2c3e50"/>
  <text x="792" y="664" font-size="13" font-weight="700" fill="#2c3e50">GAIN</text>
  <circle cx="840" cy="700" r="6" fill="#c0392b"/>
  <text x="840" y="688" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">VCC</text>
  <circle cx="920" cy="700" r="6" fill="#1a1a1a"/>
  <text x="920" y="688" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
  <circle cx="960" cy="610" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
  <text x="948" y="614" text-anchor="end" font-size="13" font-weight="700" fill="#8a6d0b">SPK+</text>
  <circle cx="960" cy="650" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
  <text x="948" y="654" text-anchor="end" font-size="13" font-weight="700" fill="#8a6d0b">SPK−</text>

  <!-- I²S on the board -->
  <line x1="630" y1="496" x2="630" y2="560" stroke="#8a2be2" stroke-width="2.5"/>
  <line x1="630" y1="560" x2="774" y2="560" stroke="#8a2be2" stroke-width="2.5"/>
  <line x1="590" y1="496" x2="590" y2="590" stroke="#8a2be2" stroke-width="2.5"/>
  <line x1="590" y1="590" x2="774" y2="590" stroke="#8a2be2" stroke-width="2.5"/>
  <line x1="550" y1="496" x2="550" y2="620" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="550" y1="620" x2="774" y2="620" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- ===== the 5 V ahead of D1 to the DFR0954, and R4 to its GAIN ===== -->
  <line x1="350" y1="190" x2="350" y2="740" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="350" y1="740" x2="840" y2="740" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="840" y1="740" x2="840" y2="706" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="730" cy="740" r="4" fill="#c0392b"/>
  <line x1="730" y1="740" x2="730" y2="730" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="717" y="670" width="26" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="709" y="694" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a">R4</text>
  <text x="709" y="712" text-anchor="end" font-size="13" font-weight="700" fill="#1a1a1a" data-fig="audio:r_gain">100 kΩ</text>
  <line x1="730" y1="670" x2="730" y2="660" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="730" y1="660" x2="774" y2="660" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- ===== the DFR0954's GND to the rail ===== -->
  <line x1="920" y1="706" x2="920" y2="770" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="920" y1="770" x2="255" y2="770" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- ===== the speaker ===== -->
  <line x1="966" y1="610" x2="1036" y2="610" stroke="#b7950b" stroke-width="2.5"/>
  <line x1="966" y1="650" x2="1036" y2="650" stroke="#b7950b" stroke-width="2.5"/>
  <circle cx="1040" cy="610" r="4" fill="#b7950b"/>
  <circle cx="1040" cy="650" r="4" fill="#b7950b"/>
  <text x="1052" y="634" font-size="11.5" fill="#333">speaker</text>
</svg>
