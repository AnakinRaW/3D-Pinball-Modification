  <circle cx="255" cy="450" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="450" r="4" fill="#1a1a1a"/>
  <text x="188" y="454" text-anchor="end" font-size="11.5" fill="#333">rotary sensor</text>
  <line x1="255" y1="490" x2="204" y2="490" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="255" cy="490" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="490" r="4" fill="#1a1a1a"/>
  <text x="188" y="494" text-anchor="end" font-size="11.5" fill="#333">display bus</text>
  <line x1="255" y1="530" x2="204" y2="530" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="255" cy="530" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="530" r="4" fill="#1a1a1a"/>
  <text x="188" y="534" text-anchor="end" font-size="11.5" fill="#333">break beam, emitter</text>
  <line x1="255" y1="570" x2="204" y2="570" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="255" cy="570" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="570" r="4" fill="#1a1a1a"/>
  <text x="188" y="574" text-anchor="end" font-size="11.5" fill="#333">break beam, receiver</text>
  <line x1="255" y1="610" x2="204" y2="610" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="255" cy="610" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="610" r="4" fill="#1a1a1a"/>
  <text x="188" y="614" text-anchor="end" font-size="11.5" fill="#333">toggle switch</text>

  <!-- ===== 3V3 rail ===== -->
  <line x1="726" y1="190" x2="840" y2="190" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="840" y1="148" x2="840" y2="242" stroke="#c0392b" stroke-width="5"/>
  <circle cx="840" cy="190" r="5" fill="#c0392b"/>
  <text x="748" y="232" font-size="12.5" font-weight="700" fill="#c0392b">3V3 rail</text>

  <line x1="840" y1="150" x2="1036" y2="150" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="1040" cy="150" r="4" fill="#c0392b"/>
  <text x="1052" y="154" font-size="11.5" fill="#333">IR mainboard, J-T</text>
  <line x1="840" y1="180" x2="1036" y2="180" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="840" cy="180" r="4" fill="#c0392b"/>
