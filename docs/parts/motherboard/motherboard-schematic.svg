  <line x1="255" y1="410" x2="204" y2="410" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="255" cy="410" r="4" fill="#1a1a1a"/>
  <circle cx="200" cy="410" r="4" fill="#1a1a1a"/>
  <text x="188" y="414" text-anchor="end" font-size="11.5" fill="#333">lighting data cable</text>
