<svg viewBox="0 0 1240 1010" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16808a"/>
    </marker>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1010" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#1a1a1a">Screen architecture</text>

  <!-- ===== legend ===== -->
  <line x1="990" y1="31" x2="1020" y2="31" stroke="#16808a" stroke-width="2" marker-end="url(#ev)"/>
  <text x="1028" y="36" font-size="12" fill="#555">event path</text>
  <line x1="1110" y1="31" x2="1140" y2="31" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="1148" y="36" font-size="12" fill="#555">call</text>

  <!-- ===== main task ===== -->
  <rect x="20" y="56" width="1200" height="650" rx="10" fill="#f5f8fb" stroke="#4a6785" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="78" font-size="13" font-weight="700" fill="#4a6785">Main task (main loop)</text>

  <rect x="40" y="96" width="220" height="100" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="54" y="120" font-size="15" font-weight="700" fill="#2c3e50">Game host</text>
  <text x="54" y="140" font-size="12" fill="#333">runs one game at a time</text>
  <text x="54" y="156" font-size="12" fill="#333">hands every event to the</text>
  <text x="54" y="172" font-size="12" fill="#333">components' translate()</text>
  <text x="54" y="188" font-size="12" fill="#333">showHost(), takeGesture()</text>

  <rect x="290" y="96" width="470" height="100" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="304" y="120" font-size="15" font-weight="700" fill="#2c3e50">Game</text>
  <text x="304" y="140" font-size="12" fill="#333">creates LVGL objects in layer() and background()</text>
  <text x="304" y="156" font-size="12" fill="#333">loads its pictures and shows them</text>
  <text x="304" y="172" font-size="12" fill="#333">plays videos and gets MovieEnded when one ends</text>

  <rect x="790" y="96" width="190" height="120" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="804" y="120" font-size="15" font-weight="700" fill="#2c3e50">VideoPlayer</text>
  <text x="804" y="140" font-size="12" fill="#333">play(name, viewport,</text>
  <text x="804" y="156" font-size="12" fill="#333">loop, sound)</text>
  <text x="804" y="172" font-size="12" fill="#333">refreshes with each frame</text>
  <text x="804" y="188" font-size="12" fill="#333">publishes MovieEnded</text>
  <text x="804" y="204" font-size="12" fill="#333">step() on an LVGL timer</text>

  <rect x="1010" y="96" width="190" height="80" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="1024" y="120" font-size="15" font-weight="700" fill="#2c3e50">Sounds</text>
  <text x="1024" y="140" font-size="12" fill="#333">interlude(name)</text>
  <text x="1024" y="156" font-size="12" fill="#333">in place of the music</text>

  <!-- screen -->
  <rect x="40" y="236" width="220" height="260" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="54" y="260" font-size="15" font-weight="700" fill="#2c3e50">Screen</text>
  <text x="54" y="282" font-size="11.5" fill="#333">begin(): LVGL's display, input</text>
  <text x="54" y="302" font-size="11.5" fill="#333">translate(): an object under</text>
  <text x="54" y="318" font-size="11.5" fill="#333">the finger takes the touch,</text>
  <text x="54" y="334" font-size="11.5" fill="#333">else a tap or a hold</text>
  <text x="54" y="354" font-size="11.5" fill="#333">update(): lv_timer_handler()</text>
  <text x="54" y="374" font-size="11.5" fill="#333">widen(): whole rows</text>
  <text x="54" y="394" font-size="11.5" fill="#333">flush(): the rows to the driver</text>
  <text x="54" y="414" font-size="11.5" fill="#333">reset(): the game's objects</text>
  <text x="54" y="430" font-size="11.5" fill="#333">and pictures</text>
  <text x="54" y="450" font-size="11.5" fill="#333">restart(): the display's, then</text>
  <text x="54" y="466" font-size="11.5" fill="#333">no LVGL until the panel is</text>
  <text x="54" y="482" font-size="11.5" fill="#333">back, and a full redraw</text>

  <!-- LVGL -->
  <rect x="290" y="236" width="470" height="260" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="304" y="260" font-size="15" font-weight="700" fill="#2c3e50">LVGL</text>
  <rect x="304" y="272" width="262" height="30" rx="5" fill="#ffffff" stroke="#4a6785" stroke-width="1.2"/>
  <text x="316" y="292" font-size="12" fill="#333">System layer: the host's layer</text>
  <rect x="304" y="308" width="262" height="30" rx="5" fill="#ffffff" stroke="#4a6785" stroke-width="1.2"/>
  <text x="316" y="328" font-size="12" fill="#333">Top layer: the game's popups</text>
  <rect x="304" y="344" width="262" height="30" rx="5" fill="#ffffff" stroke="#4a6785" stroke-width="1.2"/>
  <text x="316" y="364" font-size="12" fill="#333">Screen: the game's layer</text>
  <rect x="304" y="380" width="262" height="30" rx="5" fill="#ffffff" stroke="#4a6785" stroke-width="1.2"/>
  <text x="316" y="400" font-size="12" fill="#333">Bottom layer: the video's image</text>
  <rect x="304" y="416" width="262" height="30" rx="5" fill="#ffffff" stroke="#4a6785" stroke-width="1.2"/>
  <text x="316" y="436" font-size="12" fill="#333">Bottom layer: the background</text>
  <text x="304" y="474" font-size="11.5" fill="#555">from the front to the back</text>
  <text x="584" y="292" font-size="11.5" fill="#333">renders what changed into</text>
  <text x="584" y="308" font-size="11.5" fill="#333">one of two buffers of the</text>
  <text x="584" y="324" font-size="11.5" fill="#333">whole screen in RAM2</text>
  <text x="584" y="348" font-size="11.5" fill="#333" data-fig="t_refr">refreshes every 33 ms,</text>
  <text x="584" y="364" font-size="11.5" fill="#333">or with each video frame</text>
  <text x="584" y="388" font-size="11.5" fill="#333">copies an opaque picture</text>
  <text x="584" y="404" font-size="11.5" fill="#333">or a frame as it is,</text>
  <text x="584" y="420" font-size="11.5" fill="#333">blends a transparent one</text>
  <text x="584" y="444" font-size="11.5" fill="#333">runs its timers, the</text>
  <text x="584" y="460" font-size="11.5" fill="#333">VideoPlayer's among them</text>

  <rect x="790" y="236" width="190" height="100" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="804" y="260" font-size="15" font-weight="700" fill="#2c3e50">Picture</text>
  <text x="804" y="280" font-size="12" fill="#333">load(), show(), release()</text>
  <text x="804" y="296" font-size="12" fill="#333">one file of the game, in</text>
  <text x="804" y="312" font-size="12" fill="#333">as many images as it likes</text>

  <rect x="1010" y="236" width="190" height="80" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="1024" y="260" font-size="15" font-weight="700" fill="#2c3e50">File system</text>
  <text x="1024" y="280" font-size="12" fill="#333">open(path)</text>
  <text x="1024" y="296" font-size="12" fill="#333">in /games/&lt;id&gt;/</text>

  <rect x="40" y="536" width="140" height="150" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="54" y="560" font-size="15" font-weight="700" fill="#2c3e50">Event queue</text>
  <text x="54" y="580" font-size="12" fill="#333">oldest first:</text>
  <text x="54" y="596" font-size="12" fill="#333">TouchDown,</text>
  <text x="54" y="612" font-size="12" fill="#333">TouchMoved,</text>
  <text x="54" y="628" font-size="12" fill="#333">TouchHeld,</text>
  <text x="54" y="644" font-size="12" fill="#333">TouchUp,</text>
  <text x="54" y="660" font-size="12" fill="#333">MovieEnded</text>

  <rect x="790" y="536" width="190" height="150" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="804" y="560" font-size="15" font-weight="700" fill="#2c3e50">Picture memory</text>
  <text x="804" y="578" font-size="12" fill="#333" data-fig="b_pictures">8 MB in the PSRAM</text>
  <rect x="802" y="590" width="166" height="40" rx="5" fill="#ffffff" stroke="#4a6785" stroke-width="1.2"/>
  <text x="812" y="606" font-size="11.5" fill="#333">one end: a full-screen</text>
  <text x="812" y="621" font-size="11.5" fill="#333">picture or frame</text>
  <rect x="802" y="636" width="166" height="40" rx="5" fill="#ffffff" stroke="#4a6785" stroke-width="1.2"/>
  <text x="812" y="652" font-size="11.5" fill="#333">other end: the smaller</text>
  <text x="812" y="667" font-size="11.5" fill="#333">pictures</text>

  <!-- ===== interrupts ===== -->
  <rect x="20" y="716" width="980" height="180" rx="10" fill="#fcfaf6" stroke="#8a6d0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="738" font-size="13" font-weight="700" fill="#8a6d0b">Interrupts</text>
  <rect x="40" y="756" width="220" height="100" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="54" y="780" font-size="15" font-weight="700" fill="#5c4a00">Touch driver</text>
  <text x="54" y="800" font-size="12" fill="#333" data-fig="t_ttick">driver tick, every 20 ms</text>
  <text x="54" y="816" font-size="12" fill="#333" data-fig="n_touch_data">reads 5 bytes from the controller</text>
  <text x="54" y="832" font-size="12" fill="#333">finger()</text>
  <rect x="290" y="756" width="690" height="120" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="304" y="780" font-size="15" font-weight="700" fill="#5c4a00">Display driver</text>
  <text x="304" y="802" font-size="12" fill="#333">send(x, y, width, height, pixels, sent): a rectangle from LVGL's buffer</text>
  <text x="304" y="820" font-size="12" fill="#333" data-fig="n_burst">FlexIO3 interrupt, priority 224: refills one burst of 32 bytes at a time</text>
  <text x="304" y="838" font-size="12" fill="#333">calls sent() once the last pixel has left the bus</text>
  <text x="304" y="856" font-size="12" fill="#333" data-fig="t_dtick">restart(): the panel's setup, one step on each driver tick, every 40 ms</text>

  <!-- ===== storage task ===== -->
  <rect x="1010" y="716" width="210" height="180" rx="10" fill="#f6faf6" stroke="#3d7a3d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1024" y="738" font-size="13" font-weight="700" fill="#3d7a3d">Storage task</text>
  <rect x="1022" y="756" width="186" height="100" rx="8" fill="#eef6ee" stroke="#3d7a3d" stroke-width="2"/>
  <text x="1034" y="780" font-size="15" font-weight="700" fill="#2d5a2d">Storage driver</text>
  <text x="1034" y="800" font-size="12" fill="#333">reads the files of</text>
  <text x="1034" y="816" font-size="12" fill="#333">pictures and frames</text>

  <!-- ===== hardware ===== -->
  <rect x="40" y="926" width="220" height="60" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="54" y="952" font-size="15" font-weight="700" fill="#333">Touch panel</text>
  <text x="54" y="972" font-size="12" fill="#555">CST026 on I²C</text>
  <rect x="290" y="926" width="690" height="60" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="304" y="952" font-size="15" font-weight="700" fill="#333">ILI9341 panel</text>
  <text x="304" y="972" font-size="12" fill="#555">keeps the last picture, gets rectangles over the 8-bit bus</text>
  <rect x="1022" y="926" width="186" height="60" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="1034" y="952" font-size="15" font-weight="700" fill="#333">SD card</text>
  <text x="1034" y="972" font-size="12" fill="#555">read over SDIO</text>

  <!-- ===== calls ===== -->
  <line x1="260" y1="146" x2="288" y2="146" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <line x1="150" y1="196" x2="150" y2="234" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="142" y="220" text-anchor="end" font-size="11.5" fill="#555">translate(e)</text>
  <line x1="420" y1="196" x2="420" y2="234" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="428" y="220" font-size="11.5" fill="#555">lv_label_create(), lv_label_set_text()</text>
  <line x1="760" y1="140" x2="788" y2="140" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <path d="M760 180 H775 V286 H788" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <line x1="980" y1="146" x2="1008" y2="146" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <line x1="260" y1="300" x2="288" y2="300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <line x1="885" y1="336" x2="885" y2="534" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="893" y="440" font-size="11.5" fill="#555">take(), give()</text>
  <path d="M980 180 H995 V606 H982" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="1003" y="450" font-size="11.5" fill="#555">take(), give()</text>
  <line x1="520" y1="496" x2="520" y2="754" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="528" y="620" font-size="11.5" fill="#555">flush(): send(rows)</text>
  <line x1="660" y1="754" x2="660" y2="498" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="668" y="660" font-size="11.5" fill="#555">sent(): flush_ready()</text>
  <line x1="230" y1="496" x2="230" y2="754" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="238" y="620" font-size="11.5" fill="#555">finger()</text>
  <line x1="150" y1="856" x2="150" y2="924" stroke="#1a1a1a" stroke-width="2" marker-start="url(#call)" marker-end="url(#call)"/>
  <line x1="635" y1="876" x2="635" y2="924" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="643" y="915" font-size="11.5" fill="#555">rectangles</text>
  <path d="M1160 316 V754" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="1152" y="520" text-anchor="end" font-size="11.5" fill="#555">read()</text>
  <path d="M1022 790 H1003 V650 H982" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="1012" y="672" font-size="11.5" fill="#555">reads into it</text>
  <line x1="1115" y1="856" x2="1115" y2="924" stroke="#1a1a1a" stroke-width="2" marker-start="url(#call)" marker-end="url(#call)"/>

  <!-- ===== events ===== -->
  <line x1="110" y1="756" x2="110" y2="688" stroke="#16808a" stroke-width="2" marker-end="url(#ev)"/>
  <text x="118" y="728" font-size="11.5" fill="#16808a">touch events</text>
  <path d="M40 616 H28 V160 H38" fill="none" stroke="#16808a" stroke-width="2" marker-end="url(#ev)"/>
  <line x1="230" y1="236" x2="230" y2="198" stroke="#16808a" stroke-width="2" marker-end="url(#ev)"/>
  <text x="238" y="222" font-size="11.5" fill="#16808a">taps, holds</text>
</svg>
