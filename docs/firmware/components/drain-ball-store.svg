  <line x1="550" y1="56" x2="550" y2="370" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="400" font-size="11.5" fill="#666">IR channels are drawn above the track to show where along it they sit. The track slopes toward the plunger lane.</text>
