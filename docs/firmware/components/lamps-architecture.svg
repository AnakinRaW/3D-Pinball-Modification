<svg viewBox="0 0 760 726" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="726" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#1a1a1a">Lamps architecture</text>

  <!-- ===== game ===== -->
  <rect x="270" y="56" width="220" height="62" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="284" y="80" font-size="15" font-weight="700" fill="#2c3e50">Game</text>
  <text x="284" y="101" font-size="12" fill="#333">a key and a priority per mode</text>

  <!-- ===== lamps component ===== -->
  <rect x="20" y="166" width="720" height="220" rx="10" fill="#f5f8fb" stroke="#4a6785" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="188" font-size="13" font-weight="700" fill="#4a6785">Lamps component</text>

  <rect x="40" y="202" width="680" height="62" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="54" y="226" font-size="15" font-weight="700" fill="#2c3e50">Effects per lamp and strip</text>
  <text x="54" y="247" font-size="12" fill="#333">up to five, one per key, each with a priority</text>

  <line x1="190" y1="264" x2="190" y2="304" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="198" y="288" font-size="11.5" fill="#555">values</text>
  <line x1="570" y1="304" x2="570" y2="264" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="578" y="288" font-size="11.5" fill="#555">works out every effect</text>
  <rect x="40" y="304" width="300" height="62" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="54" y="328" font-size="15" font-weight="700" fill="#2c3e50">Top effect</text>
  <text x="54" y="349" font-size="12" fill="#333">highest priority, then the latest call</text>
  <rect x="420" y="304" width="300" height="62" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="434" y="328" font-size="15" font-weight="700" fill="#2c3e50">update(now)</text>
  <text x="434" y="349" font-size="12" fill="#333">at a fixed rate, from the main loop</text>


  <!-- ===== lighting driver ===== -->
  <rect x="20" y="434" width="720" height="118" rx="10" fill="#fcfaf6" stroke="#8a6d0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="456" font-size="13" font-weight="700" fill="#8a6d0b">Lighting driver</text>
  <rect x="40" y="470" width="300" height="62" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="54" y="494" font-size="15" font-weight="700" fill="#5c4a00">chain(c)</text>
  <text x="54" y="515" font-size="12" fill="#333">the colors of one chain's LEDs</text>
  <rect x="420" y="470" width="300" height="62" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="434" y="494" font-size="15" font-weight="700" fill="#5c4a00">show()</text>
  <text x="434" y="515" font-size="12" fill="#333">sends every chain by DMA</text>
  <line x1="340" y1="501" x2="420" y2="501" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="380" y="493" text-anchor="middle" font-size="11.5" fill="#555">colors</text>


  <!-- ===== LED chains ===== -->
  <rect x="20" y="600" width="720" height="96" rx="10" fill="#fafafa" stroke="#777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="622" font-size="13" font-weight="700" fill="#555">LED chains</text>
  <rect x="40" y="632" width="210" height="44" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="145" y="659" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Chain A</text>
  <rect x="275" y="632" width="210" height="44" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="380" y="659" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Chain B</text>
  <rect x="510" y="632" width="210" height="44" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="615" y="659" text-anchor="middle" font-size="15" font-weight="700" fill="#333">more chains</text>

  <!-- ===== calls across the layers ===== -->
  <line x1="380" y1="118" x2="380" y2="202" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="388" y="150" font-size="11.5" fill="#555">effects with the mode's key and priority</text>
  <line x1="250" y1="366" x2="250" y2="470" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="258" y="412" font-size="11.5" fill="#555">each color at its LED</text>
  <line x1="570" y1="366" x2="570" y2="470" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="578" y="412" font-size="11.5" fill="#555">starts the frame</text>
  <line x1="570" y1="532" x2="570" y2="600" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
  <text x="578" y="572" font-size="11.5" fill="#555">frame</text>
</svg>
