<svg viewBox="0 0 1180 1040" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="1040" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Stock bumper channel: sense and trigger</text>
  <rect x="30" y="48" width="481" height="30" rx="6" fill="#fdfaee" stroke="#d4b106" stroke-width="1.5"/>
  <text x="44" y="68" font-size="12" font-weight="700" fill="#7a5c00">Parts read from their package markings; no connection on the board was traced.</text>

