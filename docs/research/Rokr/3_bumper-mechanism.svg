<svg viewBox="0 0 1240 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1240" height="760" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Stock bumper trigger and wiring</text>

  <!-- ===== Playfield and foil ===== -->
  <rect x="70" y="276" width="250" height="24" fill="#efe4cf" stroke="#a08850" stroke-width="1.5"/>
  <rect x="360" y="276" width="300" height="24" fill="#efe4cf" stroke="#a08850" stroke-width="1.5"/>
  <text x="88" y="293" font-size="11.5" fill="#7a6a4a">playfield</text>

  <rect x="70" y="270" width="250" height="6" fill="#c0392b"/>
  <rect x="360" y="270" width="300" height="6" fill="#c0392b"/>
  <text x="70" y="258" font-size="13" font-weight="700" fill="#c0392b">conductive foil · +5 V</text>

  <!-- ===== Shell and plunger — one conductive node ===== -->
  <polyline points="267,205 312,255 372,255 417,205" fill="none" stroke="#b7950b" stroke-width="4" stroke-linejoin="round"/>
  <text x="255" y="200" font-size="13" font-weight="700" fill="#8a6d0b" text-anchor="end">metal shell</text>

  <rect x="336" y="255" width="12" height="110" fill="#f4ead3" stroke="#b7950b" stroke-width="1.5"/>
  <line x1="336" y1="312" x2="348" y2="312" stroke="#b7950b" stroke-width="1"/>
  <line x1="336" y1="324" x2="348" y2="324" stroke="#b7950b" stroke-width="1"/>
  <line x1="336" y1="336" x2="348" y2="336" stroke="#b7950b" stroke-width="1"/>
  <text x="260" y="330" font-size="11.5" fill="#666" text-anchor="end">threaded plunger</text>
  <line x1="264" y1="326" x2="332" y2="320" stroke="#999" stroke-width="1"/>

  <!-- ===== Ball closing the contact ===== -->
  <circle cx="426" cy="240" r="30" fill="#e8e8e8" stroke="#666" stroke-width="2"/>
  <text x="426" y="245" font-size="12" fill="#444" text-anchor="middle">ball</text>
  <circle cx="404" cy="220" r="4.5" fill="#b7950b"/>
  <circle cx="426" cy="271" r="4.5" fill="#c0392b"/>
  <text x="470" y="196" font-size="12.5" fill="#444">ball bridges foil to shell</text>
  <text x="470" y="215" font-size="12" fill="#666">conductive path 7–30 Ω</text>
  <text x="470" y="231" font-size="12" fill="#666">(varies with probe point)</text>

  <!-- ===== Foil wire to mainboard ===== -->
  <polyline points="660,273 720,273 720,210 800,210" fill="none" stroke="#8a8a8a" stroke-width="5"/>
  <polyline points="660,273 720,273 720,210 800,210" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="660" cy="273" r="4.5" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="714" y="170" font-size="11.5" fill="#666" text-anchor="end">eyelet terminal, screwed to the foil</text>

  <!-- ===== Solenoid ===== -->
  <rect x="255" y="360" width="175" height="140" rx="8" fill="#f8f4ee" stroke="#8a6d0b" stroke-width="2"/>
  <text x="342" y="390" font-size="16" font-weight="700" fill="#5c4a00" text-anchor="middle">SOLENOID 1</text>
  <text x="342" y="414" font-size="12.5" fill="#666" text-anchor="middle">5 V · 0.68 A · ≈ 7.35 Ω</text>
  <text x="342" y="434" font-size="12.5" fill="#666" text-anchor="middle">stroke ≈ 6 mm</text>
  <text x="342" y="460" font-size="11.5" fill="#666" text-anchor="middle">frame + plunger + shell:</text>
  <text x="342" y="476" font-size="11.5" fill="#666" text-anchor="middle">one node, coil isolated</text>

  <text x="100" y="524" font-size="11.5" fill="#666">coil-to-frame isolation verified (diode test, Ω)</text>
  <text x="100" y="541" font-size="11.5" fill="#666">mounted through a playfield cutout</text>

  <!-- Solenoid pins -->
  <circle cx="430" cy="390" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <circle cx="430" cy="430" r="6" fill="#c0392b"/>
  <circle cx="430" cy="460" r="6" fill="#1a1a1a"/>

  <!-- Harness: shell sense routed up to sit beside the foil -->
  <line x1="436" y1="390" x2="760" y2="390" stroke="#b7950b" stroke-width="2.5"/>
  <line x1="760" y1="390" x2="760" y2="250" stroke="#b7950b" stroke-width="2.5"/>
  <line x1="760" y1="250" x2="800" y2="250" stroke="#b7950b" stroke-width="2.5"/>
  <text x="451" y="383" font-size="12" font-weight="700" fill="#8a6d0b">frame — eyelet terminal</text>

  <line x1="436" y1="430" x2="800" y2="430" stroke="#c0392b" stroke-width="2.5"/>
  <text x="451" y="423" font-size="12" font-weight="700" fill="#c0392b">coil A</text>
  <line x1="436" y1="460" x2="800" y2="460" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="451" y="453" font-size="12" font-weight="700" fill="#1a1a1a">coil B</text>
  <text x="451" y="482" font-size="11.5" fill="#777">2-pin connector · one pin on the MOSFET drain,</text>
  <text x="451" y="498" font-size="11.5" fill="#777">the other at ground; which is which, not traced</text>

  <!-- ===== Mainboard ===== -->
  <rect x="800" y="130" width="410" height="430" rx="8" fill="#eef3f8" stroke="#4a6785" stroke-width="2"/>
  <text x="1005" y="162" font-size="16" font-weight="700" fill="#2c3e50" text-anchor="middle">MAINBOARD</text>

  <circle cx="800" cy="210" r="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
  <text x="816" y="206" font-size="13" font-weight="700" fill="#c0392b">FOIL · +5 V</text>
  <circle cx="800" cy="250" r="6" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <text x="816" y="246" font-size="13" font-weight="700" fill="#8a6d0b">SHELL 1</text>

  <circle cx="800" cy="430" r="6" fill="#c0392b"/>
  <text x="816" y="426" font-size="13" font-weight="700" fill="#c0392b">COIL 1 · A</text>
  <circle cx="800" cy="460" r="6" fill="#1a1a1a"/>
  <text x="816" y="456" font-size="13" font-weight="700" fill="#1a1a1a">COIL 1 · B</text>

  <text x="816" y="484" font-size="12" fill="#666">one pulse per trigger, also under a held contact</text>
  <text x="816" y="502" font-size="12" fill="#666">all three coils pull in at power-on and at</text>
  <text x="816" y="518" font-size="12" fill="#666">restart, ahead of light and sound</text>
  <text x="816" y="534" font-size="12" fill="#666">cut-off in hardware or firmware — not identified</text>
  <text x="816" y="552" font-size="12" fill="#666">SHELL 2/3 and COIL 2/3 wired alike, not drawn</text>

  <!-- ===== Legend ===== -->
  <text x="70" y="612" font-size="13" font-weight="700" fill="#1a1a1a">Wire colours</text>
  <line x1="70" y1="634" x2="100" y2="634" stroke="#8a8a8a" stroke-width="5"/>
  <line x1="70" y1="634" x2="100" y2="634" stroke="#ffffff" stroke-width="2.5"/>
  <text x="112" y="638" font-size="12" fill="#444">white — +5 V to the playfield foil</text>
  <line x1="70" y1="660" x2="100" y2="660" stroke="#c0392b" stroke-width="2.5"/>
  <text x="112" y="664" font-size="12" fill="#444">red — coil, one conductor of the 2-pin cable</text>
  <line x1="70" y1="686" x2="100" y2="686" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="112" y="690" font-size="12" fill="#444">black — coil, the other conductor</text>
  <line x1="70" y1="712" x2="100" y2="712" stroke="#b7950b" stroke-width="2.5"/>
  <text x="112" y="716" font-size="12" fill="#444">shell sense — one line per bumper, conductor colour not recorded</text>
</svg>
