  <text x="52" y="424" font-size="13" font-weight="700" fill="#8a6d0b">Pin 3</text>

  <!-- 5 V rail -->
  <text x="200" y="100" font-size="14" font-weight="700" fill="#c0392b">+5 V</text>
  <line x1="200" y1="108" x2="425" y2="108" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="166" y1="190" x2="230" y2="190" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="230" y1="190" x2="230" y2="108" stroke="#c0392b" stroke-width="2.5"/>
