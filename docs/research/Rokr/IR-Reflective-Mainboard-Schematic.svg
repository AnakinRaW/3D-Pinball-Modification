  <rect x="40" y="120" width="120" height="310" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="52" y="146" font-size="12" fill="#555">Connector</text>
  <circle cx="160" cy="190" r="6" fill="#c0392b"/>
