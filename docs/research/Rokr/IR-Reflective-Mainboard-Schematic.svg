<svg viewBox="0 0 815 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="815" height="580" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#1a1a1a">Mainboard, per sensor channel</text>
  <rect x="30" y="48" width="330" height="30" fill="#fdf3d1" stroke="#d4b106"/>
  <text x="40" y="68" font-size="13" font-weight="700" fill="#7a5c00">ASSUMPTION — reconstructed, not measured</text>

