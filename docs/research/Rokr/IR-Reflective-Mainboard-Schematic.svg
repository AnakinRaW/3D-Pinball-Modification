  <line x1="398" y1="200" x2="398" y2="228" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="420" y="176" font-size="13" fill="#1a1a1a">16 kΩ ("163")</text>
  <line x1="398" y1="228" x2="600" y2="228" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="600,228 586,222 586,234" fill="#1a1a1a"/>
