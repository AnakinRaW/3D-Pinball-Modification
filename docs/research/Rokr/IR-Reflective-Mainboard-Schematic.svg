  <text x="672" y="486" font-size="13" font-weight="700" fill="#1a1a1a">Q1 · S8050 ("J3Y")</text>

  <line x1="400" y1="481" x2="638" y2="481" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="470" y="473" width="60" height="16" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="200" y="486" font-size="12.5" fill="#1a1a1a">from controller · 1.5 ms on / off</text>

  <line x1="656" y1="516" x2="656" y2="546" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="640" y1="546" x2="672" y2="546" stroke="#1a1a1a" stroke-width="3"/>
