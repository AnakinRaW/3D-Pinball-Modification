  <line x1="380" y1="318" x2="398" y2="336" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="398,336 388,333 393,326" fill="#1a1a1a"/>
  <text x="404" y="312" font-size="13" font-weight="700" fill="#1a1a1a">Q2 · S8050 ("J3Y")</text>

  <line x1="398" y1="264" x2="398" y2="228" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="398" cy="228" r="4" fill="#1a1a1a"/>
